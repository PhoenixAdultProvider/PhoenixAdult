# Mirrored by .github/workflows/ci.yml; change both when the gate changes.
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'phoenixadult/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.env.example'
      - 'docs/sitelist.md'
      - '.forgejo/workflows/ci.yml'
  pull_request:
    paths:
      - 'phoenixadult/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.env.example'
      - 'docs/sitelist.md'
      - '.forgejo/workflows/ci.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: codeberg-small
    container:
      # Big community image — effectively always warm in the runner's docker cache,
      # unlike the python+node combo image (~570MB cold pull per host) that the
      # cache action needed. The cache saved ~22s/run and cost ~58s/run; dropped.
      image: python:3.13-bookworm
    env:
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "https://codeberg.org/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 2 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Comments
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            python scripts/check_comments.py HEAD~1..HEAD
          else
            echo "no parent commit; skipping comment gate"
          fi

      - name: Install
        run: |
          # nodejs runs the page-script load test; without it that test skips.
          apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs
          pip install -q uv
          uv pip install --system -e '.[dev,face]'

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy phoenixadult

      - name: Tests
        run: pytest -q --no-cov
