name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: codeberg-tiny
    container:
      # python + node: node is required by the JS cache/checkout actions.
      image: nikolaik/python-nodejs:python3.13-nodejs26
    env:
      NODE_OPTIONS: --no-deprecation
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "https://codeberg.org/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      # Warm mypy's incremental cache and uv's wheel cache from the last run.
      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            .mypy_cache
            /root/.cache/uv
            /root/.cache/pip
          key: gate-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            gate-${{ hashFiles('pyproject.toml') }}-
            gate-

      - name: Install
        run: |
          pip install -q uv
          uv pip install --system -e '.[dev]'

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Tests
        run: pytest -q --no-cov
