<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <title>Metadata Cache</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; margin: 0; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }

    /* ── Search row ── */
    .searchbar { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
    .searchbar .filter-group { flex: 1 1 auto; max-width: 380px; }

    /* ── Filter grid ── */
    .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; margin-bottom: 12px; }
    .filter-group { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .filter-group label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .04em; }
    .filter-group input[type=text],
    .filter-group select {
      width: 100%; background: #1e2433; border: 1px solid #334155; color: #e2e8f0;
      padding: 6px 10px; border-radius: 6px; font-size: 13px; height: 32px;
    }
    .filter-group input[type=text]::placeholder { color: #475569; }

    /* ── Action toolbar ── */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding-top: 12px; margin-bottom: 18px; border-top: 1px solid #1a2035;
    }
    .toolbar .spacer { flex: 1 1 auto; }
    .count-badge { font-size: 12px; color: #64748b; align-self: center; }
    .reset-btn {
      padding: 0 12px; height: 32px; border: 1px solid #334155;
      border-radius: 6px; background: #1e2433; color: #94a3b8; cursor: pointer; font-size: 12px;
    }
    .reset-btn:hover { color: #e2e8f0; border-color: #475569; }
    .reset-btn:disabled { color: #475569; border-color: #1e2433; cursor: not-allowed; }
    #pager { display: none; gap: 8px; align-items: center; }

    /* ── Cards ── */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .card {
      display: flex; flex-direction: column; gap: 6px; padding: 12px;
      background: #151b29; border: 1px solid #1a2035; border-radius: 8px;
    }
    .card:hover { border-color: #334155; }
    .card img, .card .noimg { width: 100%; height: 190px; border-radius: 4px; background: #0b0d12; display: block; }
    .card img { object-fit: contain; }
    .noimg { display: flex; align-items: center; justify-content: center; color: #334155; font-size: 12px; }
    .c-title { font-size: 18px; font-weight: 600; line-height: 1.3; color: #f1f5f9; overflow-wrap: anywhere; }
    .c-studio { font-size: 13px; color: #94a3b8; overflow-wrap: anywhere; }
    .c-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; overflow-wrap: anywhere; }
    .c-row::before {
      content: attr(data-label); flex: 0 0 auto; align-self: center; color: #64748b;
      font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    }
    .c-actors { font-size: 13px; color: #cbd5e1; overflow-wrap: anywhere; }
    .c-actors a { color: inherit; text-decoration: none; border-bottom: 1px dotted #475569; }
    .c-actors a:hover { color: #60a5fa; border-bottom-color: #60a5fa; }
    .c-actors::before {
      content: attr(data-label); display: block; color: #64748b;
      font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px;
    }
    .c-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; padding-top: 4px; }
    .c-actions button { width: 100%; }

    /* ── Misc ── */
    .blank { color: #334155; }
    .manual { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #7c3aed; color: #fff; vertical-align: middle; }
    .cached-ts { color: #94a3b8; white-space: nowrap; }
    .edit-btn { padding: 8px 16px; border: 1px solid #334155; border-radius: 6px; background: #1e2433; color: #cbd5e1; cursor: pointer; font-size: 14px; white-space: nowrap; font-weight: 500; }
    .edit-btn:hover { background: #2563eb; border-color: #2563eb; color: #fff; }
    .purge-btn { padding: 8px 16px; border: 0; border-radius: 6px; background: #b91c1c; color: #fff; cursor: pointer; font-size: 14px; white-space: nowrap; font-weight: 500; }
    .purge-btn:hover { background: #dc2626; }
    .purge-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .export-btn { padding: 8px 16px; border: 1px solid #2563eb; border-radius: 6px; background: #1e293b; color: #60a5fa; cursor: pointer; font-size: 14px; white-space: nowrap; font-weight: 500; }
    .export-btn:hover { background: #1d4ed8; color: #fff; }
    .export-btn:disabled { border-color: #334155; background: #1e293b; color: #64748b; cursor: not-allowed; }
    .refresh-btn { padding: 8px 16px; border: 1px solid #1d4ed8; border-radius: 6px; background: #1e293b; color: #93c5fd; cursor: pointer; font-size: 14px; white-space: nowrap; font-weight: 500; }
    .refresh-btn:hover { background: #1d4ed8; color: #fff; }
    .refresh-btn:disabled { border-color: #334155; background: #1e293b; color: #64748b; cursor: not-allowed; }
    .sfw-toggle { padding: 8px 16px; border: 1px solid #334155; border-radius: 6px; background: #1e2433; color: #94a3b8; font-size: 14px; white-space: nowrap; font-weight: 500; cursor: pointer; }
    .sfw-toggle:hover { color: #e2e8f0; border-color: #475569; }
    .sfw-toggle.on { background: #15803d; border-color: #15803d; color: #fff; }
    .dup-toggle { padding: 8px 16px; border: 1px solid #f59e0b; border-radius: 6px; background: #1e293b; color: #f59e0b; font-size: 14px; white-space: nowrap; font-weight: 500; cursor: pointer; }
    .dup-toggle.on { background: #b45309; color: #fff; }
    .dup-btn { padding: 8px 16px; border: 1px solid #334155; border-radius: 6px; background: #1e293b; color: #64748b; font-size: 14px; white-space: nowrap; font-weight: 500; cursor: not-allowed; }
    .dup-btn.active { background: #b45309; border-color: #f59e0b; color: #fff; cursor: pointer; }
    .dup-btn.active:hover { background: #d97706; }
    .prune-btn { padding: 8px 16px; border: 1px solid #475569; border-radius: 6px; background: #1e293b; color: #94a3b8; cursor: pointer; font-size: 14px; white-space: nowrap; font-weight: 500; }
    .prune-btn:hover { background: #334155; color: #e2e8f0; }
    .empty { color: #94a3b8; margin-top: 24px; }

    /* ── Progress ── */
    .progress { margin-bottom: 14px; }
    .progress-head { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
    .progress-track { height: 8px; border-radius: 4px; background: #1a2035; overflow: hidden; }
    .progress-fill { height: 100%; width: 0; border-radius: 4px; background: #2563eb; transition: width .3s ease; }

    /* ── Sort bar ── */
    .sortbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
    .sortbar label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .04em; }
    .sortbar select {
      min-width: 180px; background: #1e2433; border: 1px solid #334155; color: #e2e8f0;
      padding: 6px 10px; border-radius: 6px; font-size: 13px; height: 32px;
    }
    .sortbar button {
      flex: 0 0 auto; height: 32px; padding: 0 12px; border: 1px solid #334155;
      border-radius: 6px; background: #1e2433; color: #cbd5e1; font-size: 13px;
      white-space: nowrap; cursor: pointer;
    }
    .sortbar button:hover { color: #e2e8f0; border-color: #475569; }

    /* ── Mobile ── */
    .filters-toggle { display: none; }

    @media (max-width: 720px) {
      body { padding: 14px; }

      .cards { grid-template-columns: 1fr; }
      .sortbar select { flex: 1; min-width: 0; }

      .searchbar { flex-wrap: wrap; }
      .searchbar .filter-group { max-width: none; }
      .filters-toggle {
        display: block; width: 100%; height: 32px; padding: 0 8px; border: 1px solid #334155;
        border-radius: 6px; background: #1e2433; color: #cbd5e1; font-size: 13px; cursor: pointer;
      }
      .filters-toggle.on { border-color: #2563eb; color: #e2e8f0; }
      .controls { display: none; }
      .controls.open { display: block; }
      .filters { grid-template-columns: 1fr; }
      .toolbar > button { width: 100%; }
      .toolbar .spacer { display: none; }
      #pager { width: 100%; justify-content: space-between; }

      .c-title { font-size: 20px; }
      .c-cached .cached-ts { white-space: normal; }
      .c-actions button { font-size: 15px; padding: 11px 12px; }
    }
  </style>
</head>
<body>
  __NAV__
  <h1>Snapshot Metadata Cache</h1>
  <div class="sub">Status: __STATE__</div>

  <div class="searchbar">
    <div class="filter-group">
      <label for="q">Search</label>
      <input type="text" id="q" placeholder="title, studio, tagline…" oninput="queryChanged()">
    </div>
    <button class="filters-toggle" id="filtersToggle" onclick="toggleFilters()">Filters</button>
  </div>

  <div class="controls" id="controls">
  <div class="filters">
    <div class="filter-group">
      <label for="f-actor">Actor</label>
      <input type="text" id="f-actor" list="actor-options" autocomplete="off" placeholder="start typing a name…" oninput="actorChanged()">
      <datalist id="actor-options"></datalist>
    </div>
    <div class="filter-group">
      <label>Provider</label>
      <select id="f-provider" onchange="facetChanged()"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label>Studio</label>
      <select id="f-studio" onchange="facetChanged()"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label>Tagline</label>
      <select id="f-tagline" onchange="facetChanged()"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label>Collection</label>
      <select id="f-collection" onchange="facetChanged()"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label>Genres</label>
      <select id="f-genre" onchange="facetChanged()">
        <option value="">All</option>
        <option value="__blank__">Untagged</option>
        <option value="__set__">Tagged</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Cast</label>
      <select id="f-cast" onchange="facetChanged()">
        <option value="">All</option>
        <option value="__blank__">Uncredited</option>
        <option value="__set__">Credited</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Directors</label>
      <select id="f-director" onchange="facetChanged()">
        <option value="">All</option>
        <option value="__blank__">Uncredited</option>
        <option value="__set__">Credited</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Producers</label>
      <select id="f-producer" onchange="facetChanged()">
        <option value="">All</option>
        <option value="__blank__">Uncredited</option>
        <option value="__set__">Credited</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Data18</label>
      <select id="f-data18" onchange="facetChanged()">
        <option value="">All</option>
        <option value="__set__">Filled</option>
        <option value="__manual__">Manual</option>
        <option value="__blank__">Blank</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Year</label>
      <select id="f-year" onchange="facetChanged()"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label>Month</label>
      <select id="f-month" onchange="facetChanged()"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label>Day</label>
      <select id="f-day" onchange="facetChanged()"><option value="">All</option></select>
    </div>
  </div>

  <div class="toolbar">
    <button class="reset-btn" onclick="reset()">Reset</button>
    <button class="sfw-toggle" id="sfwToggle" onclick="toggleSfw()"></button>
    <button class="dup-toggle" id="dupToggle" onclick="toggleDuplicates()" hidden>Show Stale</button>
    <button class="dup-toggle" id="potToggle" onclick="togglePotential()">Show Duplicates</button>
    <button class="dup-btn" id="dupBtn" onclick="purgeDuplicates()" disabled></button>
    <button class="prune-btn" id="pruneBtn" onclick="pruneNames()">Prune Unused Names</button>
    <button class="export-btn" id="exportBtn" onclick="exportShown()" disabled></button>
    <button class="refresh-btn" id="refreshAllBtn" onclick="refreshShown()" disabled></button>
    <button class="purge-btn" id="purgeAllBtn" onclick="purgeShown()" disabled></button>
    <span class="spacer"></span>
    <span class="count-badge" id="count"></span>
    <span id="pager">
      <button class="reset-btn" id="prevBtn" onclick="prevPage()">Previous</button>
      <span class="count-badge" id="pageInfo"></span>
      <button class="reset-btn" id="nextBtn" onclick="nextPage()">Next</button>
    </span>
  </div>
  </div>

  <div class="progress" id="progress" style="display:none">
    <div class="progress-head"><span id="progress-label"></span><span id="progress-pct"></span></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <div class="sortbar">
    <label for="mobileSort">Sort By</label>
    <select id="mobileSort" onchange="mobileSortChanged()"></select>
    <button id="sortDirBtn" onclick="toggleSortDir()" title="Reverse Sort Order"></button>
  </div>

  <div class="cards" id="cards"></div>
  <p class="empty" id="empty" style="display:none">No snapshots match the current filters.</p>

  <script>
    const TOKEN = __TOKEN__;
    const DUP_KEYS = __DUP_KEYS__;
    let ALL = __ENTRIES_JSON__;
    let TOTAL = __TOTAL__;
    let STUDIOS = __STUDIOS__;
    let FACET_VALUES = __FACETS__;
    let DUP_SET = new Set(DUP_KEYS);
    let showDupsOnly = false;
    let showPotential = false;
    const STORE_KEY = 'metadata-cache-filters';
    const SFW_KEY = 'metadata-sfw';
    let SFW = false;
    try { SFW = localStorage.getItem(SFW_KEY) === '1'; } catch {}

    function paintSfwToggle() {
      const btn = document.getElementById('sfwToggle');
      btn.textContent = SFW ? 'SFW Mode: On' : 'SFW Mode: Off';
      btn.classList.toggle('on', SFW);
      btn.title = SFW ? 'Previews are hidden and never downloaded' : 'Hide every image preview';
    }

    function toggleSfw() {
      SFW = !SFW;
      try { localStorage.setItem(SFW_KEY, SFW ? '1' : '0'); } catch {}
      paintSfwToggle();
      render();
    }
    const FILTER_IDS = ['q', 'f-actor', 'f-genre', 'f-cast', 'f-director', 'f-producer', 'f-provider', 'f-studio', 'f-year', 'f-month', 'f-day', 'f-tagline', 'f-collection', 'f-data18'];
    const SORT_FIELDS = [
      {key: 'mtime', label: 'Cached'},
      {key: 'date', label: 'Date'},
      {key: 'studio', label: 'Studio'},
      {key: 'title', label: 'Scene Title'},
      {key: 'tagline', label: 'Tagline'},
      {key: 'year', label: 'Year'},
      {key: 'data18_id', label: 'Data18'},
    ];

    // ── Every filter, sort, and page runs in SQL, so pages and totals agree ──
    const PAGE_SIZE = 500;
    let offset = 0;
    const SERVER_SORTS = {mtime: 'updated_at', date: 'release_date', year: 'release_date', title: 'title', studio: 'studio', tagline: 'tagline', data18_id: 'data18_id'};
    const FILTER_PARAMS = {'f-actor': 'actor', 'f-genre': 'genre', 'f-cast': 'cast', 'f-director': 'director', 'f-producer': 'producer', 'f-provider': 'provider', 'f-studio': 'studio', 'f-year': 'year', 'f-month': 'month', 'f-day': 'day', 'f-tagline': 'tagline', 'f-collection': 'collection', 'f-data18': 'data18'};

    function filterParams() {
      const p = new URLSearchParams();
      const q = document.getElementById('q').value.trim();
      if (q) p.set('q', q);
      for (const [id, param] of Object.entries(FILTER_PARAMS)) {
        const v = document.getElementById(id).value.trim();
        if (v) p.set(param, v);
      }
      if (showPotential) p.set('dups', '2');
      else if (showDupsOnly) p.set('dups', '1');
      return p;
    }

    function anyFilterActive() { return [...filterParams().keys()].length > 0; }

    function serverQuery(limit, useOffset) {
      const p = filterParams();
      p.set('sort', SERVER_SORTS[sortKey] || 'updated_at');
      p.set('dir', sortDir === 1 ? 'asc' : 'desc');
      p.set('limit', limit);
      p.set('offset', useOffset ? offset : 0);
      return p.toString();
    }

    let qTimer = null;
    function queryChanged() {
      clearTimeout(qTimer);
      qTimer = setTimeout(() => { offset = 0; refreshEntries(); }, 300);
    }

    function facetChanged() { offset = 0; refreshEntries(); }

    let actorTimer = null;
    let actorSuggestedFor = null;

    async function loadActorOptions(prefix) {
      if (actorSuggestedFor === prefix) return;
      actorSuggestedFor = prefix;
      try {
        const p = new URLSearchParams({limit: '50'});
        if (prefix) p.set('q', prefix);
        const r = await fetch('/metadata/actors?' + p.toString(), {headers: authHeaders()});
        if (!r.ok) return;
        const list = document.getElementById('actor-options');
        list.textContent = '';
        ((await r.json()).actors || []).forEach(name => {
          const o = document.createElement('option');
          o.value = name;
          list.appendChild(o);
        });
      } catch {}
    }

    function actorChanged() {
      clearTimeout(actorTimer);
      actorTimer = setTimeout(() => {
        loadActorOptions(document.getElementById('f-actor').value.trim());
        offset = 0;
        refreshEntries();
      }, 300);
    }

    function prevPage() { if (offset > 0) { offset = Math.max(0, offset - PAGE_SIZE); refreshEntries(); } }
    function nextPage() { if (offset + PAGE_SIZE < TOTAL) { offset += PAGE_SIZE; refreshEntries(); } }

    function updatePager() {
      const pages = Math.max(1, Math.ceil(TOTAL / PAGE_SIZE));
      const page = Math.floor(offset / PAGE_SIZE) + 1;
      document.getElementById('pager').style.display = pages > 1 ? 'inline-flex' : 'none';
      document.getElementById('pageInfo').textContent = `Page ${page} of ${pages}`;
      document.getElementById('prevBtn').disabled = offset <= 0;
      document.getElementById('nextBtn').disabled = offset + PAGE_SIZE >= TOTAL;
    }

    function decorate() {
      ALL.forEach(e => {
        e.year = e.date ? e.date.slice(0, 4) : '';
        e.month = e.date ? e.date.slice(5, 7) : '';
        e.day = e.date ? e.date.slice(8, 10) : '';
        e.cached_display = e.mtime
          ? new Date(e.mtime * 1000).toLocaleString(undefined, {dateStyle: 'short', timeStyle: 'short'})
          : '';
      });
    }

    const MONTH_NAMES = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    function ensureOption(sel, value) {
      if (value && ![...sel.options].some(o => o.value === value)) {
        const o = document.createElement('option');
        o.value = value; o.textContent = value === '__blank__' ? '(Blank)' : value;
        sel.appendChild(o);
      }
      sel.value = value;
    }

    // Rebuild the facet dropdowns from the server-wide value lists, preserving the
    // current selection (re-added as an option so an active filter never resets).
    function buildFacetOptions() {
      const specs = {
        'f-provider': {values: FACET_VALUES.providers || []},
        'f-studio': {values: STUDIOS},
        'f-tagline': {values: FACET_VALUES.taglines || [], blank: FACET_VALUES.tagline_blank},
        'f-collection': {values: FACET_VALUES.collections || [], blank: FACET_VALUES.collection_blank},
        'f-year': {values: FACET_VALUES.years || [], blank: FACET_VALUES.year_blank},
        'f-month': {values: FACET_VALUES.months || [], label: m => `${m} – ${MONTH_NAMES[+m]}`},
        'f-day': {values: FACET_VALUES.days || []},
      };
      for (const [id, spec] of Object.entries(specs)) {
        const sel = document.getElementById(id);
        const prev = sel.value;
        while (sel.options.length > 1) sel.remove(1); // keep "All"
        if (spec.blank) {
          const o = document.createElement('option'); o.value = '__blank__'; o.textContent = '(Blank)'; sel.appendChild(o);
        }
        spec.values.forEach(v => {
          const o = document.createElement('option'); o.value = v; o.textContent = spec.label ? spec.label(v) : v; sel.appendChild(o);
        });
        ensureOption(sel, prev);
      }
    }

    const DEFAULT_SORT_KEY = 'mtime';
    const DEFAULT_SORT_DIR = -1; // newest first

    let sortKey = DEFAULT_SORT_KEY;
    let sortDir = DEFAULT_SORT_DIR;

    function saveFilters() {
      const facets = {};
      FILTER_IDS.forEach(id => { facets[id] = document.getElementById(id).value; });
      try { localStorage.setItem(STORE_KEY, JSON.stringify({facets, sortKey, sortDir, showDupsOnly, showPotential})); } catch {}
    }

    function restoreFilters() {
      let saved;
      try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch {}
      if (!saved) return;
      FILTER_IDS.forEach(id => {
        const v = (saved.facets || {})[id] || '';
        const el = document.getElementById(id);
        if (el.tagName === 'SELECT') ensureOption(el, v); else el.value = v;
      });
      if (saved.sortKey && SERVER_SORTS[saved.sortKey]) { sortKey = saved.sortKey; sortDir = saved.sortDir === 1 ? 1 : -1; }
      if (saved.showDupsOnly && DUP_SET.size) setDupsOnly(true);
      if (saved.showPotential) setPotential(true);
    }

    function buildSortOptions() {
      const sel = document.getElementById('mobileSort');
      SORT_FIELDS.forEach(field => {
        const o = document.createElement('option');
        o.value = field.key;
        o.textContent = field.label;
        sel.appendChild(o);
      });
    }

    function applySortIndicators() {
      const sel = document.getElementById('mobileSort');
      if (sel.value !== sortKey) sel.value = sortKey;
      document.getElementById('sortDirBtn').textContent = sortDir === 1 ? '↑ Ascending' : '↓ Descending';
    }

    function mobileSortChanged() {
      const key = document.getElementById('mobileSort').value;
      if (key !== sortKey) sort(key);
    }

    function toggleSortDir() { sort(sortKey); }

    function sort(key) {
      if (sortKey === key) { sortDir = -sortDir; } else { sortKey = key; sortDir = 1; }
      applySortIndicators();
      offset = 0;
      refreshEntries();
    }

    function toggleFilters() {
      const open = document.getElementById('controls').classList.toggle('open');
      document.getElementById('filtersToggle').setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function updateFilterToggle() {
      const active = Object.keys(FILTER_PARAMS).filter(id => document.getElementById(id).value).length + (showDupsOnly ? 1 : 0) + (showPotential ? 1 : 0);
      const btn = document.getElementById('filtersToggle');
      btn.textContent = active ? `Filters (${active} Active)` : 'Filters';
      btn.classList.toggle('on', active > 0);
    }

    function reset() {
      FILTER_IDS.forEach(id => { document.getElementById(id).value = ''; });
      if (showDupsOnly) setDupsOnly(false);
      if (showPotential) setPotential(false);
      sortKey = DEFAULT_SORT_KEY;
      sortDir = DEFAULT_SORT_DIR;
      applySortIndicators();
      offset = 0;
      refreshEntries();
    }

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function render() {
      saveFilters();
      const rows = ALL;

      document.getElementById('count').textContent = rows.length
        ? `${offset + 1}–${offset + rows.length} of ${TOTAL} snapshot(s)`
        : `0 of ${TOTAL} snapshot(s)`;
      updatePager();
      updateFilterToggle();

      const filtered = anyFilterActive();
      const bulkBtn = document.getElementById('purgeAllBtn');
      bulkBtn.disabled = !TOTAL;
      bulkBtn.textContent = filtered ? `Purge Filtered (${TOTAL})` : `Purge All (${TOTAL})`;
      const exportBtn = document.getElementById('exportBtn');
      exportBtn.disabled = !TOTAL;
      exportBtn.textContent = `Export Mappings (${TOTAL})`;
      const refreshBtn = document.getElementById('refreshAllBtn');
      refreshBtn.disabled = !TOTAL;
      refreshBtn.textContent = filtered ? `Refresh Filtered (${TOTAL})` : `Refresh All (${TOTAL})`;

      const cards = document.getElementById('cards');
      const empty = document.getElementById('empty');
      if (!rows.length) { cards.innerHTML = ''; empty.style.display = ''; return; }
      empty.style.display = 'none';

      cards.innerHTML = rows.map(e => {
        const thumb = SFW
          ? ''
          : `<div class="c-thumb">${e.thumb ? `<img src="${esc(e.thumb + (e.thumb.includes('/cache/') ? (e.thumb.includes('?') ? '&' : '?') + 'v=' + Math.floor(e.mtime || 0) : ''))}" loading="lazy" alt="">` : '<div class="noimg">No Image</div>'}</div>`;
        const heading = e.tagline && e.tagline !== e.studio ? `${e.studio} · ${e.tagline}` : e.studio;
        const data18 = e.data18_id
          ? esc(e.data18_id) + (e.data18_also ? ' <span class="manual">+' + e.data18_also.split(',').length + '</span>' : '') + (e.data18_manual ? ' <span class="manual">manual</span>' : '')
          : '<span class="blank">—</span>';
        const actors = (e.actors || []).length
          ? `<div class="c-actors" data-label="Actors">${(e.actors || []).map(a => `<a href="${esc(personLink(a))}">${esc(a)}</a>`).join(', ')}</div>`
          : '';
        const key = esc(JSON.stringify(e.key));
        return `<div class="card">
          ${thumb}
          <div class="c-title">${esc(e.title)}</div>
          <div class="c-studio">${esc(heading)}</div>
          <div class="c-row c-date" data-label="Date">${e.date ? esc(e.date) : '<span class="blank">—</span>'}</div>
          <div class="c-row c-genres" data-label="Genres">${e.genres || 0}</div>
          ${actors}
          <div class="c-row c-data18" data-label="Data18">${data18}</div>
          <div class="c-row c-cached" data-label="Cached"><span class="cached-ts">${esc(e.cached_display || '—')}</span></div>
          <div class="c-actions">
            <button class="edit-btn" onclick="edit(${key})">Edit</button>
            <button class="purge-btn" onclick="purge(${key})">Purge</button>
          </div>
        </div>`;
      }).join('');
    }

    function authHeaders(extra) {
      const h = Object.assign({}, extra || {});
      if (TOKEN) h['x-admin-token'] = TOKEN;
      return h;
    }

    function edit(key) {
      const p = new URLSearchParams({key});
      if (TOKEN) p.set('token', TOKEN);
      location.href = '/metadata/edit?' + p.toString();
    }

    function personLink(name) {
      const p = new URLSearchParams({name});
      if (TOKEN) p.set('token', TOKEN);
      return '/people/edit?' + p.toString();
    }

    async function purge(key) {
      if (!confirm('Purge this snapshot?')) return;
      const r = await fetch('/metadata/purge', {method: 'POST', headers: authHeaders({'Content-Type': 'application/json'}), body: JSON.stringify({key})});
      const j = await r.json().catch(() => ({ok: false}));
      if (j.ok) refreshNow(); else alert('Purge failed');
    }

    // Every row matching the current filters, unpaged (limit=0 → no limit server-side).
    async function fetchAllMatching() {
      const r = await fetch('/metadata/entries?' + serverQuery(0, false), {headers: authHeaders()});
      if (!r.ok) return null;
      return (await r.json()).entries || [];
    }

    async function exportShown() {
      const rows = await fetchAllMatching();
      if (!rows || !rows.length) return;
      const lines = rows.map(e => {
        const also = e.data18_also ? `, "also": ${JSON.stringify(e.data18_also.split(','))}` : '';
        return `  ${JSON.stringify(e.data18_id || '')}: { "slug": ${JSON.stringify(e.mapping_slug || '')}, "type": ${JSON.stringify(e.data18_type || 'scene')}${also} }`;
      });
      const blob = new Blob(['{\n' + lines.join(',\n') + '\n}\n'], {type: 'application/json'});
      // Name per the active filter (tagline > collection > studio) so the file drops
      // straight in next to the base mappings file.
      const scope = ['f-tagline', 'f-collection', 'f-studio', 'f-provider']
        .map(id => document.getElementById(id).value)
        .find(v => v && v !== '__blank__');
      const suffix = scope ? `_${scope.replace(/\W/g, '').toLowerCase()}` : '';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `data18_manual_mappings${suffix}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    async function refreshShown() {
      if (!TOTAL) return;
      const msg = anyFilterActive()
        ? `Re-scrape the ${TOTAL} snapshot(s) matching the current filters?\n\nEach stored snapshot is replaced, so manual edits to them are lost. Scrapes run in the background — watch /queue.`
        : `Re-scrape ALL ${TOTAL} cached snapshot(s)?\n\nEach stored snapshot is replaced, so manual edits to them are lost. Scrapes run in the background — watch /queue.`;
      if (!confirm(msg)) return;
      const btn = document.getElementById('refreshAllBtn');
      btn.disabled = true;
      const rows = await fetchAllMatching();
      if (!rows || !rows.length) { btn.disabled = false; return; }
      const r = await fetch('/metadata/refresh-bulk', {method: 'POST', headers: authHeaders({'Content-Type': 'application/json'}), body: JSON.stringify({keys: rows.map(e => e.key)})});
      const j = await r.json().catch(() => ({ok: false}));
      btn.disabled = false;
      if (!j.ok) { alert('Refresh failed'); return; }
      if (j.skipped) alert(`Queued ${j.queued} re-scrape(s); ${j.skipped} skipped (already queued or the queue is full).`);
      trackQueue();
    }

    let queueTimer = null;

    async function queueState() {
      try {
        const r = await fetch('/queue/api/state', {headers: authHeaders()});
        if (r.ok) return await r.json();
      } catch {}
      return null;
    }

    async function pollQueue() {
      const state = await queueState();
      const box = document.getElementById('progress');
      const total = (state && state.total) || 0;
      if (!total) {
        box.style.display = 'none';
        clearInterval(queueTimer);
        queueTimer = null;
        refreshNow();
        return;
      }
      const done = Math.min(state.done || 0, total);
      const pct = Math.round((done / total) * 100);
      document.getElementById('progress-label').textContent =
        `Scraping ${done} of ${total} · ${state.running || 0} running · ${state.pending || 0} left`;
      document.getElementById('progress-pct').textContent = pct + '%';
      document.getElementById('progress-fill').style.width = pct + '%';
      box.style.display = '';
    }

    function trackQueue() {
      if (queueTimer) return;
      pollQueue();
      queueTimer = setInterval(pollQueue, 2000);
    }

    async function purgeShown() {
      if (!TOTAL) return;
      const msg = anyFilterActive()
        ? `Purge the ${TOTAL} snapshot(s) matching the current filters? This cannot be undone.`
        : `Purge ALL ${TOTAL} cached snapshot(s)? This cannot be undone.`;
      if (!confirm(msg)) return;
      const rows = await fetchAllMatching();
      if (!rows || !rows.length) return;
      const r = await fetch('/metadata/purge-bulk', {method: 'POST', headers: authHeaders({'Content-Type': 'application/json'}), body: JSON.stringify({keys: rows.map(e => e.key)})});
      const j = await r.json().catch(() => ({ok: false}));
      if (j.ok) refreshNow(); else alert('Purge failed');
    }

    async function purgeDuplicates() {
      const n = DUP_SET.size;
      if (!n) return;
      if (!confirm(`Purge ${n} stale duplicate snapshot(s)? The newest copy of each scene is kept.`)) return;
      const r = await fetch('/metadata/purge-duplicates', {method: 'POST', headers: authHeaders()});
      const j = await r.json().catch(() => ({ok: false}));
      if (j.ok) refreshNow(); else alert('Purge failed');
    }

    async function pruneNames() {
      if (!confirm('Delete every person, studio, tagline, collection, genre and country that no scene references?\n\nThey come back automatically the next time a scene credits them.')) return;
      const btn = document.getElementById('pruneBtn');
      btn.disabled = true;
      try {
        const r = await fetch('/metadata/prune-names', {method: 'POST', headers: authHeaders()});
        const j = await r.json().catch(() => ({ok: false}));
        if (!j.ok) { alert('Prune failed'); return; }
        const detail = Object.entries(j.pruned || {}).map(([t, n]) => `${n} ${t}`).join(', ');
        alert(j.total ? `Pruned ${j.total} unused name(s): ${detail}` : 'Nothing to prune.');
        refreshNow();
      } finally {
        btn.disabled = false;
      }
    }

    function setDupsOnly(on) {
      showDupsOnly = on;
      if (on && showPotential) setPotential(false);
      const t = document.getElementById('dupToggle');
      t.classList.toggle('on', on);
      t.textContent = on ? 'Showing Stale Only' : 'Show Stale';
    }

    function setPotential(on) {
      showPotential = on;
      if (on && showDupsOnly) setDupsOnly(false);
      const t = document.getElementById('potToggle');
      t.classList.toggle('on', on);
      t.textContent = on ? 'Showing Duplicates Only' : 'Show Duplicates';
    }

    function togglePotential() {
      setPotential(!showPotential);
      offset = 0;
      refreshEntries();
    }

    function toggleDuplicates() {
      setDupsOnly(!showDupsOnly);
      offset = 0;
      refreshEntries();
    }

    function updateDupButtons() {
      const n = DUP_SET.size;
      const btn = document.getElementById('dupBtn');
      btn.textContent = n ? `Purge ${n} Duplicate ${n === 1 ? 'Entry' : 'Entries'}` : 'No Duplicate Entries';
      btn.disabled = !n;
      btn.classList.toggle('active', n > 0);
      document.getElementById('dupToggle').hidden = !n;
      if (!n && showDupsOnly) setDupsOnly(false);
    }

    // ── Live refresh: poll a cheap change token; refetch entries only when it moves ──
    let stateToken = null;

    async function refreshEntries() {
      try {
        const r = await fetch('/metadata/entries?' + serverQuery(PAGE_SIZE, true), {headers: authHeaders()});
        if (!r.ok) return;
        const j = await r.json();
        ALL = j.entries;
        TOTAL = j.total ?? ALL.length;
        STUDIOS = j.studios || STUDIOS;
        FACET_VALUES = j.facets || FACET_VALUES;
        DUP_SET = new Set(j.dup_keys);
        if (offset > 0 && offset >= TOTAL) {
          offset = Math.max(0, Math.floor(Math.max(TOTAL - 1, 0) / PAGE_SIZE) * PAGE_SIZE);
          return refreshEntries();
        }
        decorate();
        buildFacetOptions();
        updateDupButtons();
        applySortIndicators();
        render();
      } catch {}
    }

    async function refreshNow() {
      try {
        const r = await fetch('/metadata/state', {headers: authHeaders()});
        if (r.ok) stateToken = (await r.json()).token;
      } catch {}
      await refreshEntries();
    }

    async function pollState() {
      if (document.hidden) return;
      try {
        const r = await fetch('/metadata/state', {headers: authHeaders()});
        if (!r.ok) return;
        const token = (await r.json()).token;
        if (stateToken !== null && token !== stateToken) await refreshEntries();
        stateToken = token;
      } catch {}
    }

    document.getElementById('f-actor').addEventListener('focus', () => loadActorOptions(document.getElementById('f-actor').value.trim()));

    paintSfwToggle();
    decorate();
    buildFacetOptions();
    buildSortOptions();
    const DEFAULT_QUERY = serverQuery(PAGE_SIZE, true);
    restoreFilters();
    updateDupButtons();
    applySortIndicators();
    render();
    if (serverQuery(PAGE_SIZE, true) !== DEFAULT_QUERY) refreshEntries();
    pollState();
    setInterval(pollState, 4000);
    queueState().then(s => { if (s && s.total) trackQueue(); });
  </script>
</body>
</html>
