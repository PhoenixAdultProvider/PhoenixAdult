<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <title>Metadata Cache</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; margin: 0; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }

    /* ── Filter bar ── */
    .filters { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: flex-end; }
    .filter-group { display: flex; flex-direction: column; gap: 3px; }
    .filter-group label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .04em; }
    .filters input[type=text],
    .filters select {
      background: #1e2433; border: 1px solid #334155; color: #e2e8f0;
      padding: 6px 10px; border-radius: 6px; font-size: 13px; height: 32px;
    }
    .filters input[type=text] { width: 240px; }
    .filters select { min-width: 140px; }
    .filters input[type=text]::placeholder { color: #475569; }
    .count-badge { font-size: 12px; color: #64748b; align-self: center; padding-bottom: 2px; }
    .reset-btn {
      align-self: flex-end; padding: 0 12px; height: 32px; border: 1px solid #334155;
      border-radius: 6px; background: #1e2433; color: #94a3b8; cursor: pointer; font-size: 12px;
    }
    .reset-btn:hover { color: #e2e8f0; border-color: #475569; }
    .reset-btn:disabled { color: #475569; border-color: #1e2433; cursor: not-allowed; }
    #pager { display: none; gap: 8px; align-items: center; align-self: flex-end; }

    /* ── Table ── */
    .wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 24px; }
    thead th {
      background: #1a2035; color: #94a3b8; text-align: left;
      padding: 9px 12px; border-bottom: 2px solid #334155;
      white-space: nowrap; position: sticky; top: 0; z-index: 1;
    }
    thead th.sortable { cursor: pointer; user-select: none; }
    thead th.sortable:hover { color: #e2e8f0; }
    thead th.sort-asc::after { content: ' \2191'; color: #60a5fa; }
    thead th.sort-desc::after { content: ' \2193'; color: #60a5fa; }
    tbody td { padding: 5px 12px; border-bottom: 1px solid #1a2035; vertical-align: middle; }
    tbody tr:hover td { background: #1a2035; }

    /* ── Thumb cell ── */
    .thumb-cell { width: 240px; text-align: center; }
    .thumb-cell img { height: 160px; width: auto; max-width: 240px; object-fit: contain; border-radius: 4px; background: #0b0d12; display: inline-block; vertical-align: middle; }
    .noimg { height: 160px; width: 224px; background: #0b0d12; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: #334155; font-size: 10px; }

    /* ── Misc ── */
    .blank { color: #334155; }
    .manual { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #7c3aed; color: #fff; vertical-align: middle; }
    .cached-ts { color: #94a3b8; white-space: nowrap; }
    .edit-btn { padding: 8px 16px; border: 1px solid #334155; border-radius: 6px; background: #1e2433; color: #cbd5e1; cursor: pointer; font-size: 14px; white-space: nowrap; font-weight: 500; }
    .edit-btn:hover { background: #2563eb; border-color: #2563eb; color: #fff; }
    .purge-btn { padding: 8px 16px; border: 0; border-radius: 6px; background: #b91c1c; color: #fff; cursor: pointer; font-size: 14px; white-space: nowrap; font-weight: 500; }
    .purge-btn:hover { background: #dc2626; }
    .purge-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .export-btn { padding: 8px 16px; border: 1px solid #2563eb; border-radius: 6px; background: #1e293b; color: #60a5fa; cursor: pointer; font-size: 14px; white-space: nowrap; font-weight: 500; }
    .export-btn:hover { background: #1d4ed8; color: #fff; }
    .export-btn:disabled { border-color: #334155; background: #1e293b; color: #64748b; cursor: not-allowed; }
    .dup-toggle { padding: 8px 16px; border: 1px solid #f59e0b; border-radius: 6px; background: #1e293b; color: #f59e0b; font-size: 14px; white-space: nowrap; font-weight: 500; cursor: pointer; }
    .dup-toggle.on { background: #b45309; color: #fff; }
    .dup-btn { padding: 8px 16px; border: 1px solid #334155; border-radius: 6px; background: #1e293b; color: #64748b; font-size: 14px; white-space: nowrap; font-weight: 500; cursor: not-allowed; }
    .dup-btn.active { background: #b45309; border-color: #f59e0b; color: #fff; cursor: pointer; }
    .dup-btn.active:hover { background: #d97706; }
    .empty { color: #94a3b8; margin-top: 24px; }

    /* ── Mobile ── */
    .filters-toggle, .mobile-sort { display: none; }

    @media (max-width: 720px) {
      body { padding: 14px; }

      .filters { gap: 8px; }
      .filters-toggle {
        display: block; width: 100%; padding: 8px; border: 1px solid #334155;
        border-radius: 6px; background: #1e2433; color: #cbd5e1; font-size: 13px; cursor: pointer;
      }
      .filters-toggle.on { border-color: #2563eb; color: #e2e8f0; }
      .filters > .filter-group:not(.always), .filters > button:not(.filters-toggle) { display: none; }
      .filters.open > .filter-group { display: flex; }
      .filters.open > button:not(.filters-toggle):not([hidden]) { display: block; }
      .filters > .filter-group, .filters input[type=text], .filters select, .filters > button { width: 100%; }
      #pager { width: 100%; justify-content: space-between; }

      .mobile-sort { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
      .mobile-sort label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .04em; }
      .mobile-sort select {
        flex: 1; min-width: 0; background: #1e2433; border: 1px solid #334155; color: #e2e8f0;
        padding: 6px 10px; border-radius: 6px; font-size: 13px; height: 32px;
      }
      .mobile-sort button {
        flex: 0 0 auto; height: 32px; padding: 0 12px; border: 1px solid #334155;
        border-radius: 6px; background: #1e2433; color: #cbd5e1; font-size: 13px;
        white-space: nowrap; cursor: pointer;
      }

      table { font-size: 15px; }
      thead { display: none; }
      table, tbody { display: block; }
      tbody tr {
        display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px;
        background: #151b29; border: 1px solid #1a2035; border-radius: 8px;
        padding: 12px; margin-bottom: 12px;
      }
      tbody tr:hover td { background: none; }
      tbody td { display: block; grid-column: 1 / -1; padding: 0; border: 0; }
      .c-thumb { order: 1; width: auto; }
      .c-thumb img { width: 100%; height: 190px; max-width: none; }
      .c-thumb .noimg { width: 100%; height: 190px; font-size: 12px; }
      .c-title { order: 2; font-size: 20px; font-weight: 600; line-height: 1.3; color: #f1f5f9; overflow-wrap: anywhere; }
      .c-studio { order: 3; color: #94a3b8; overflow-wrap: anywhere; }
      .c-year { display: none; }
      .c-date { order: 4; }
      .c-tagline { order: 5; }
      .c-cached { order: 6; }
      .c-data18 { order: 7; }
      .c-date, .c-tagline, .c-cached, .c-data18 {
        display: flex; justify-content: space-between; gap: 12px; overflow-wrap: anywhere;
      }
      .c-date::before, .c-tagline::before, .c-cached::before, .c-data18::before {
        content: attr(data-label); flex: 0 0 auto; color: #64748b; font-size: 11px;
        text-transform: uppercase; letter-spacing: .04em; align-self: center;
      }
      .c-cached .cached-ts { white-space: normal; }
      tbody td:empty { display: none; }
      tbody td:has(> .blank) { display: none; }
      .c-edit { order: 8; grid-column: 1; }
      .c-purge { order: 9; grid-column: 2; }
      .c-edit .edit-btn, .c-purge .purge-btn { width: 100%; font-size: 15px; padding: 11px 12px; }
    }
  </style>
</head>
<body>
  <h1>Snapshot Metadata Cache</h1>
  <div class="sub">Status: __STATE__</div>

  <div class="filters">
    <div class="filter-group always">
      <label>Search</label>
      <input type="text" id="q" placeholder="title, studio, tagline…" oninput="queryChanged()">
    </div>
    <button class="filters-toggle" id="filtersToggle" onclick="toggleFilters()">Filters</button>
    <div class="filter-group">
      <label>Provider</label>
      <select id="f-provider" onchange="facetChanged()"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label>Studio</label>
      <select id="f-studio" onchange="facetChanged()"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label>Year</label>
      <select id="f-year" onchange="facetChanged()"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label>Month</label>
      <select id="f-month" onchange="facetChanged()"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label>Day</label>
      <select id="f-day" onchange="facetChanged()"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label>Tagline</label>
      <select id="f-tagline" onchange="facetChanged()"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label>Collection</label>
      <select id="f-collection" onchange="facetChanged()"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label>Data18</label>
      <select id="f-data18" onchange="facetChanged()">
        <option value="">All</option>
        <option value="__set__">Filled</option>
        <option value="__manual__">Manual</option>
        <option value="__blank__">Blank</option>
      </select>
    </div>
    <button class="reset-btn" onclick="reset()">Reset</button>
    <button class="dup-toggle" id="dupToggle" onclick="toggleDuplicates()" hidden>Show Duplicates</button>
    <button class="dup-btn" id="dupBtn" onclick="purgeDuplicates()" disabled></button>
    <button class="export-btn" id="exportBtn" onclick="exportShown()" disabled></button>
    <button class="purge-btn" id="purgeAllBtn" onclick="purgeShown()" disabled></button>
    <span class="count-badge" id="count"></span>
    <span id="pager">
      <button class="reset-btn" id="prevBtn" onclick="prevPage()">Previous</button>
      <span class="count-badge" id="pageInfo"></span>
      <button class="reset-btn" id="nextBtn" onclick="nextPage()">Next</button>
    </span>
  </div>

  <div class="mobile-sort">
    <label for="mobileSort">Sort By</label>
    <select id="mobileSort" onchange="mobileSortChanged()"></select>
    <button id="sortDirBtn" onclick="toggleSortDir()" title="Reverse Sort Order"></button>
  </div>

  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th class="thumb-cell">Image</th>
          <th class="sortable" data-key="mtime" onclick="sort('mtime')">Cached</th>
          <th class="sortable" data-key="date" onclick="sort('date')">Date</th>
          <th class="sortable" data-key="studio" onclick="sort('studio')">Studio</th>
          <th class="sortable" data-key="title" onclick="sort('title')">Scene Title</th>
          <th class="sortable" data-key="tagline" onclick="sort('tagline')">Tagline</th>
          <th class="sortable" data-key="year" onclick="sort('year')">Year</th>
          <th class="sortable" data-key="data18_id" onclick="sort('data18_id')">Data18</th>
          <th>Edit</th>
          <th>Purge</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <p class="empty" id="empty" style="display:none">No snapshots match the current filters.</p>
  </div>

  <script>
    const TOKEN = __TOKEN__;
    const DUP_KEYS = __DUP_KEYS__;
    let ALL = __ENTRIES_JSON__;
    let TOTAL = __TOTAL__;
    let STUDIOS = __STUDIOS__;
    let FACET_VALUES = __FACETS__;
    let DUP_SET = new Set(DUP_KEYS);
    let showDupsOnly = false;
    const STORE_KEY = 'metadata-cache-filters';
    const FILTER_IDS = ['q', 'f-provider', 'f-studio', 'f-year', 'f-month', 'f-day', 'f-tagline', 'f-collection', 'f-data18'];

    // ── Every filter, sort, and page runs in SQL, so pages and totals agree ──
    const PAGE_SIZE = 500;
    let offset = 0;
    const SERVER_SORTS = {mtime: 'updated_at', date: 'release_date', year: 'release_date', title: 'title', studio: 'studio', tagline: 'tagline', data18_id: 'data18_id'};
    const FILTER_PARAMS = {'f-provider': 'provider', 'f-studio': 'studio', 'f-year': 'year', 'f-month': 'month', 'f-day': 'day', 'f-tagline': 'tagline', 'f-collection': 'collection', 'f-data18': 'data18'};

    function filterParams() {
      const p = new URLSearchParams();
      const q = document.getElementById('q').value.trim();
      if (q) p.set('q', q);
      for (const [id, param] of Object.entries(FILTER_PARAMS)) {
        const v = document.getElementById(id).value;
        if (v) p.set(param, v);
      }
      if (showDupsOnly) p.set('dups', '1');
      return p;
    }

    function anyFilterActive() { return [...filterParams().keys()].length > 0; }

    function serverQuery(limit, useOffset) {
      const p = filterParams();
      p.set('sort', SERVER_SORTS[sortKey] || 'updated_at');
      p.set('dir', sortDir === 1 ? 'asc' : 'desc');
      p.set('limit', limit);
      p.set('offset', useOffset ? offset : 0);
      return p.toString();
    }

    let qTimer = null;
    function queryChanged() {
      clearTimeout(qTimer);
      qTimer = setTimeout(() => { offset = 0; refreshEntries(); }, 300);
    }

    function facetChanged() { offset = 0; refreshEntries(); }

    function prevPage() { if (offset > 0) { offset = Math.max(0, offset - PAGE_SIZE); refreshEntries(); } }
    function nextPage() { if (offset + PAGE_SIZE < TOTAL) { offset += PAGE_SIZE; refreshEntries(); } }

    function updatePager() {
      const pages = Math.max(1, Math.ceil(TOTAL / PAGE_SIZE));
      const page = Math.floor(offset / PAGE_SIZE) + 1;
      document.getElementById('pager').style.display = pages > 1 ? 'inline-flex' : 'none';
      document.getElementById('pageInfo').textContent = `Page ${page} of ${pages}`;
      document.getElementById('prevBtn').disabled = offset <= 0;
      document.getElementById('nextBtn').disabled = offset + PAGE_SIZE >= TOTAL;
    }

    function decorate() {
      ALL.forEach(e => {
        e.year = e.date ? e.date.slice(0, 4) : '';
        e.month = e.date ? e.date.slice(5, 7) : '';
        e.day = e.date ? e.date.slice(8, 10) : '';
        e.cached_display = e.mtime
          ? new Date(e.mtime * 1000).toLocaleString(undefined, {dateStyle: 'short', timeStyle: 'short'})
          : '';
      });
    }

    const MONTH_NAMES = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    function ensureOption(sel, value) {
      if (value && ![...sel.options].some(o => o.value === value)) {
        const o = document.createElement('option');
        o.value = value; o.textContent = value === '__blank__' ? '(Blank)' : value;
        sel.appendChild(o);
      }
      sel.value = value;
    }

    // Rebuild the facet dropdowns from the server-wide value lists, preserving the
    // current selection (re-added as an option so an active filter never resets).
    function buildFacetOptions() {
      const specs = {
        'f-provider': {values: FACET_VALUES.providers || []},
        'f-studio': {values: STUDIOS},
        'f-tagline': {values: FACET_VALUES.taglines || [], blank: FACET_VALUES.tagline_blank},
        'f-collection': {values: FACET_VALUES.collections || [], blank: FACET_VALUES.collection_blank},
        'f-year': {values: FACET_VALUES.years || [], blank: FACET_VALUES.year_blank},
        'f-month': {values: FACET_VALUES.months || [], label: m => `${m} – ${MONTH_NAMES[+m]}`},
        'f-day': {values: FACET_VALUES.days || []},
      };
      for (const [id, spec] of Object.entries(specs)) {
        const sel = document.getElementById(id);
        const prev = sel.value;
        while (sel.options.length > 1) sel.remove(1); // keep "All"
        spec.values.forEach(v => {
          const o = document.createElement('option'); o.value = v; o.textContent = spec.label ? spec.label(v) : v; sel.appendChild(o);
        });
        if (spec.blank) {
          const o = document.createElement('option'); o.value = '__blank__'; o.textContent = '(Blank)'; sel.appendChild(o);
        }
        ensureOption(sel, prev);
      }
    }

    const DEFAULT_SORT_KEY = 'mtime';
    const DEFAULT_SORT_DIR = -1; // newest first

    let sortKey = DEFAULT_SORT_KEY;
    let sortDir = DEFAULT_SORT_DIR;

    function saveFilters() {
      const facets = {};
      FILTER_IDS.forEach(id => { facets[id] = document.getElementById(id).value; });
      try { localStorage.setItem(STORE_KEY, JSON.stringify({facets, sortKey, sortDir, showDupsOnly})); } catch {}
    }

    function restoreFilters() {
      let saved;
      try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch {}
      if (!saved) return;
      FILTER_IDS.forEach(id => {
        const v = (saved.facets || {})[id] || '';
        const el = document.getElementById(id);
        if (el.tagName === 'SELECT') ensureOption(el, v); else el.value = v;
      });
      if (saved.sortKey && SERVER_SORTS[saved.sortKey]) { sortKey = saved.sortKey; sortDir = saved.sortDir === 1 ? 1 : -1; }
      if (saved.showDupsOnly && DUP_SET.size) setDupsOnly(true);
    }

    function buildSortOptions() {
      const sel = document.getElementById('mobileSort');
      document.querySelectorAll('thead th[data-key]').forEach(th => {
        const o = document.createElement('option');
        o.value = th.dataset.key;
        o.textContent = th.textContent.trim();
        sel.appendChild(o);
      });
    }

    function applySortIndicators() {
      document.querySelectorAll('thead th[data-key]').forEach(th => {
        th.classList.remove('sort-asc', 'sort-desc');
        if (th.dataset.key === sortKey) th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
      });
      const sel = document.getElementById('mobileSort');
      if (sel.value !== sortKey) sel.value = sortKey;
      document.getElementById('sortDirBtn').textContent = sortDir === 1 ? '↑ Ascending' : '↓ Descending';
    }

    function mobileSortChanged() {
      const key = document.getElementById('mobileSort').value;
      if (key !== sortKey) sort(key);
    }

    function toggleSortDir() { sort(sortKey); }

    function sort(key) {
      if (sortKey === key) { sortDir = -sortDir; } else { sortKey = key; sortDir = 1; }
      applySortIndicators();
      offset = 0;
      refreshEntries();
    }

    function toggleFilters() {
      const open = document.querySelector('.filters').classList.toggle('open');
      document.getElementById('filtersToggle').setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function updateFilterToggle() {
      const active = Object.keys(FILTER_PARAMS).filter(id => document.getElementById(id).value).length + (showDupsOnly ? 1 : 0);
      const btn = document.getElementById('filtersToggle');
      btn.textContent = active ? `Filters (${active} Active)` : 'Filters';
      btn.classList.toggle('on', active > 0);
    }

    function reset() {
      FILTER_IDS.forEach(id => { document.getElementById(id).value = ''; });
      if (showDupsOnly) setDupsOnly(false);
      sortKey = DEFAULT_SORT_KEY;
      sortDir = DEFAULT_SORT_DIR;
      applySortIndicators();
      offset = 0;
      refreshEntries();
    }

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function render() {
      saveFilters();
      const rows = ALL;

      document.getElementById('count').textContent = rows.length
        ? `${offset + 1}–${offset + rows.length} of ${TOTAL} snapshot(s)`
        : `0 of ${TOTAL} snapshot(s)`;
      updatePager();
      updateFilterToggle();

      const filtered = anyFilterActive();
      const bulkBtn = document.getElementById('purgeAllBtn');
      bulkBtn.disabled = !TOTAL;
      bulkBtn.textContent = filtered ? `Purge Filtered (${TOTAL})` : `Purge All (${TOTAL})`;
      const exportBtn = document.getElementById('exportBtn');
      exportBtn.disabled = !TOTAL;
      exportBtn.textContent = `Export Mappings (${TOTAL})`;

      const tbody = document.getElementById('tbody');
      const empty = document.getElementById('empty');
      if (!rows.length) { tbody.innerHTML = ''; empty.style.display = ''; return; }
      empty.style.display = 'none';

      tbody.innerHTML = rows.map(e => {
        const thumb = e.thumb
          ? `<img src="${esc(e.thumb)}" loading="lazy" alt="">`
          : `<div class="noimg">—</div>`;
        const cached = e.cached_display ? `<span class="cached-ts">${esc(e.cached_display)}</span>` : '<span class="blank">—</span>';
        const date = e.date ? esc(e.date) : '<span class="blank">—</span>';
        const tagline = e.tagline ? esc(e.tagline) : '<span class="blank">—</span>';
        const year = e.year ? esc(e.year) : '<span class="blank">—</span>';
        const data18 = e.data18_id
          ? esc(e.data18_id) + (e.data18_manual ? ' <span class="manual">manual</span>' : '')
          : '<span class="blank">—</span>';
        const key = esc(JSON.stringify(e.key));
        return `<tr>
          <td class="thumb-cell c-thumb">${thumb}</td>
          <td class="c-cached" data-label="Cached">${cached}</td>
          <td class="c-date" data-label="Date">${date}</td>
          <td class="c-studio" data-label="Studio">${esc(e.studio)}</td>
          <td class="c-title" data-label="Scene Title">${esc(e.title)}</td>
          <td class="c-tagline" data-label="Tagline">${tagline}</td>
          <td class="c-year" data-label="Year">${year}</td>
          <td class="c-data18" data-label="Data18">${data18}</td>
          <td class="c-edit"><button class="edit-btn" onclick="edit(${key})">Edit</button></td>
          <td class="c-purge"><button class="purge-btn" onclick="purge(${key})">Purge</button></td>
        </tr>`;
      }).join('');
    }

    function authHeaders(extra) {
      const h = Object.assign({}, extra || {});
      if (TOKEN) h['x-admin-token'] = TOKEN;
      return h;
    }

    function edit(key) {
      const p = new URLSearchParams({key});
      if (TOKEN) p.set('token', TOKEN);
      location.href = '/metadata/edit?' + p.toString();
    }

    async function purge(key) {
      if (!confirm('Purge this snapshot?')) return;
      const r = await fetch('/metadata/purge', {method: 'POST', headers: authHeaders({'Content-Type': 'application/json'}), body: JSON.stringify({key})});
      const j = await r.json().catch(() => ({ok: false}));
      if (j.ok) refreshNow(); else alert('Purge failed');
    }

    // Every row matching the current filters, unpaged (limit=0 → no limit server-side).
    async function fetchAllMatching() {
      const r = await fetch('/metadata/entries?' + serverQuery(0, false), {headers: authHeaders()});
      if (!r.ok) return null;
      return (await r.json()).entries || [];
    }

    async function exportShown() {
      const rows = await fetchAllMatching();
      if (!rows || !rows.length) return;
      const lines = rows.map(e =>
        `  ${JSON.stringify(e.data18_id || '')}: { "slug": ${JSON.stringify(e.mapping_slug || '')}, "type": ${JSON.stringify(e.data18_type || 'scene')} }`
      );
      const blob = new Blob(['{\n' + lines.join(',\n') + '\n}\n'], {type: 'application/json'});
      // Name per the active filter (tagline > collection > studio) so the file drops
      // straight in next to the base mappings file.
      const scope = ['f-tagline', 'f-collection', 'f-studio', 'f-provider']
        .map(id => document.getElementById(id).value)
        .find(v => v && v !== '__blank__');
      const suffix = scope ? `_${scope.replace(/\W/g, '').toLowerCase()}` : '';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `data18_manual_mappings${suffix}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    async function purgeShown() {
      if (!TOTAL) return;
      const msg = anyFilterActive()
        ? `Purge the ${TOTAL} snapshot(s) matching the current filters? This cannot be undone.`
        : `Purge ALL ${TOTAL} cached snapshot(s)? This cannot be undone.`;
      if (!confirm(msg)) return;
      const rows = await fetchAllMatching();
      if (!rows || !rows.length) return;
      const r = await fetch('/metadata/purge-bulk', {method: 'POST', headers: authHeaders({'Content-Type': 'application/json'}), body: JSON.stringify({keys: rows.map(e => e.key)})});
      const j = await r.json().catch(() => ({ok: false}));
      if (j.ok) refreshNow(); else alert('Purge failed');
    }

    async function purgeDuplicates() {
      const n = DUP_SET.size;
      if (!n) return;
      if (!confirm(`Purge ${n} superseded duplicate snapshot(s)? The newer sub-site entry is kept.`)) return;
      const r = await fetch('/metadata/purge-duplicates', {method: 'POST', headers: authHeaders()});
      const j = await r.json().catch(() => ({ok: false}));
      if (j.ok) refreshNow(); else alert('Purge failed');
    }

    function setDupsOnly(on) {
      showDupsOnly = on;
      const t = document.getElementById('dupToggle');
      t.classList.toggle('on', on);
      t.textContent = on ? 'Showing Duplicates Only' : 'Show Duplicates';
    }

    function toggleDuplicates() {
      setDupsOnly(!showDupsOnly);
      offset = 0;
      refreshEntries();
    }

    function updateDupButtons() {
      const n = DUP_SET.size;
      const btn = document.getElementById('dupBtn');
      btn.textContent = n ? `Purge ${n} Duplicate ${n === 1 ? 'Entry' : 'Entries'}` : 'No Duplicate Entries';
      btn.disabled = !n;
      btn.classList.toggle('active', n > 0);
      document.getElementById('dupToggle').hidden = !n;
      if (!n && showDupsOnly) setDupsOnly(false);
    }

    // ── Live refresh: poll a cheap change token; refetch entries only when it moves ──
    let stateToken = null;

    async function refreshEntries() {
      try {
        const r = await fetch('/metadata/entries?' + serverQuery(PAGE_SIZE, true), {headers: authHeaders()});
        if (!r.ok) return;
        const j = await r.json();
        ALL = j.entries;
        TOTAL = j.total ?? ALL.length;
        STUDIOS = j.studios || STUDIOS;
        FACET_VALUES = j.facets || FACET_VALUES;
        DUP_SET = new Set(j.dup_keys);
        if (offset > 0 && offset >= TOTAL) {
          offset = Math.max(0, Math.floor(Math.max(TOTAL - 1, 0) / PAGE_SIZE) * PAGE_SIZE);
          return refreshEntries();
        }
        decorate();
        buildFacetOptions();
        updateDupButtons();
        applySortIndicators();
        render();
      } catch {}
    }

    async function refreshNow() {
      try {
        const r = await fetch('/metadata/state', {headers: authHeaders()});
        if (r.ok) stateToken = (await r.json()).token;
      } catch {}
      await refreshEntries();
    }

    async function pollState() {
      if (document.hidden) return;
      try {
        const r = await fetch('/metadata/state', {headers: authHeaders()});
        if (!r.ok) return;
        const token = (await r.json()).token;
        if (stateToken !== null && token !== stateToken) await refreshEntries();
        stateToken = token;
      } catch {}
    }

    decorate();
    buildFacetOptions();
    buildSortOptions();
    const DEFAULT_QUERY = serverQuery(PAGE_SIZE, true);
    restoreFilters();
    updateDupButtons();
    applySortIndicators();
    render();
    if (serverQuery(PAGE_SIZE, true) !== DEFAULT_QUERY) refreshEntries();
    pollState();
    setInterval(pollState, 4000);
  </script>
</body>
</html>
