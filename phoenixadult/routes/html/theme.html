{% set tv = theme_view() %}{% if tv.mode %}<meta name="color-scheme" content="{{ tv.mode }}">
<link id="pa-theme-css" data-theme-file="{{ tv.name }}" rel="stylesheet" href="/themes/{{ tv.name }}.css?v={{ theme_version(tv.name) }}">
{% else %}<meta name="color-scheme" content="dark light">
<link id="pa-theme-css" data-theme-file="{{ tv.dark }}" rel="stylesheet" href="/themes/{{ tv.dark }}.css?v={{ theme_version(tv.dark) }}" media="(prefers-color-scheme: dark)">
<link id="pa-theme-css-alt" data-theme-file="{{ tv.light }}" rel="stylesheet" href="/themes/{{ tv.light }}.css?v={{ theme_version(tv.light) }}" media="(prefers-color-scheme: light)">
{% endif %}<link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: 'Archivo';
    src: url('/fonts/archivo-latin.woff2') format('woff2');
    font-weight: 400 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('/fonts/jetbrains-mono-latin.woff2') format('woff2');
    font-weight: 400 600;
    font-style: normal;
    font-display: swap;
  }
  @view-transition { navigation: auto; }
  @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }
</style>
{% if user_theme().dark or user_theme().light %}<script>window.paUserTheme = {{ user_theme()|tojson }};</script>{% endif %}
<script>window.paThemeVersions = {{ theme_versions()|tojson }};</script>
<script>
  (function () {
    const MODE_KEY = 'pa-theme';
    const NAME_KEYS = { dark: 'pa-theme-dark', light: 'pa-theme-light' };
    const THEMES = { dark: ['midnight', 'forest'], light: ['sky', 'meadow'] };
    const SERVER = window.paUserTheme || {};
    const VIEW_COOKIE = 'pa_view';
    const media = matchMedia('(prefers-color-scheme: light)');
    const read = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
    const write = (key, value) => { try { value === null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch {} };

    function resolvedMode() {
      const pref = read(MODE_KEY);
      return pref === 'light' || pref === 'dark' ? pref : (media.matches ? 'light' : 'dark');
    }

    function readView() {
      const found = document.cookie.match(/(?:^|;\s*)pa_view=([a-z]+)\.([a-z0-9]+)/);
      return found && THEMES[found[1]] && THEMES[found[1]].includes(found[2]) ? { mode: found[1], name: found[2] } : null;
    }

    function themeName(mode) {
      const server = SERVER[mode];
      if (THEMES[mode].includes(server)) return server;
      const stored = read(NAME_KEYS[mode]);
      if (THEMES[mode].includes(stored)) return stored;
      const view = readView();
      return view && view.mode === mode ? view.name : THEMES[mode][0];
    }

    function ensureLoaded(name) {
      if (document.querySelector('link[data-theme-file="' + name + '"]:not([media])')) return;
      const link = document.createElement('link');
      link.dataset.themeFile = name;
      link.rel = 'stylesheet';
      link.href = '/themes/' + name + '.css?v=' + ((window.paThemeVersions || {})[name] || '');
      document.head.appendChild(link);
    }

    function writeView(mode, name) {
      const value = mode + '.' + name;
      if (document.cookie.indexOf(VIEW_COOKIE + '=' + value) !== -1) return;
      document.cookie = VIEW_COOKIE + '=' + value + ';path=/;max-age=31536000;samesite=lax';
    }

    function apply() {
      const mode = resolvedMode();
      const name = themeName(mode);
      const root = document.documentElement;
      if (root.dataset.theme !== mode) root.dataset.theme = mode;
      if (root.dataset.themeName !== name) root.dataset.themeName = name;
      ensureLoaded(name);
      writeView(mode, name);
      document.dispatchEvent(new CustomEvent('pa-theme-change'));
    }

    media.addEventListener('change', () => { if (!read(MODE_KEY)) apply(); });
    window.paTheme = {
      themes: THEMES,
      mode: () => { const pref = read(MODE_KEY); return pref === 'light' || pref === 'dark' ? pref : 'auto'; },
      resolvedMode,
      themeName,
      set(pref) { write(MODE_KEY, pref === 'auto' ? null : pref); apply(); },
      setThemeName(mode, name) { if (THEMES[mode].includes(name)) { SERVER[mode] = name; write(NAME_KEYS[mode], name); apply(); } },
      ensureLoaded,
    };
    apply();
  })();
</script>
