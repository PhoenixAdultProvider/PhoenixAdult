<script>
  (function () {
    const KEY = 'pa-theme';
    const media = matchMedia('(prefers-color-scheme: light)');
    const stored = () => { try { return localStorage.getItem(KEY); } catch { return null; } };
    function apply() {
      const pref = stored();
      const mode = pref === 'light' || pref === 'dark' ? pref : (media.matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = mode;
      document.dispatchEvent(new CustomEvent('pa-theme-change'));
    }
    media.addEventListener('change', () => { if (!stored()) apply(); });
    window.paTheme = {
      mode: () => { const pref = stored(); return pref === 'light' || pref === 'dark' ? pref : 'auto'; },
      set(pref) {
        try { pref === 'auto' ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, pref); } catch {}
        apply();
      },
    };
    apply();
  })();
</script>
