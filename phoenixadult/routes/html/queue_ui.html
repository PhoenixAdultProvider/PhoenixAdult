<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <title>Scrape Queue</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--page-bg); color: var(--page-text); margin: 0; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 22px 0 10px; color: var(--soft-text); }
    h2 .count-badge { margin-left: 8px; }
    .sub { color: var(--muted-text); font-size: 13px; margin-bottom: 20px; }
    .pacers { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .pacer { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 10px 14px; font-size: 13px; display: flex; gap: 14px; align-items: baseline; }
    .pacer .tag { font-weight: 600; }
    .pacer .cd { font-variant-numeric: tabular-nums; color: var(--status-warn-text); }
    .pacer .cd.ready { color: var(--status-ok-text); }
    .pacer .win { color: var(--label-text); font-size: 12px; }
    .count-badge { font-size: 12px; color: var(--label-text); font-weight: 400; }
    .list { display: flex; flex-direction: column; gap: 6px; }
    .item { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 6px; padding: 8px 12px; font-size: 13px; display: flex; align-items: center; gap: 10px; }
    .item.running { border-color: var(--running-item-border); background: var(--running-item-bg); }
    .item .label { flex: 1; word-break: break-all; }
    .item .age { color: var(--label-text); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .spinner { width: 14px; height: 14px; border: 2px solid var(--spinner-track); border-top-color: var(--spinner-head); border-radius: 50%; animation: spin 0.9s linear infinite; flex: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pos { color: var(--empty-text); font-size: 12px; width: 26px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
    .empty { color: var(--empty-text); font-size: 13px; padding: 14px; }
    .cd.banned { color: var(--status-danger-text); font-weight: 700; }
    .pause-banner { background: var(--banner-danger-bg); color: var(--banner-danger-text); border-radius: 6px; padding: 8px 14px; font-size: 13px;
                    margin-bottom: 12px; display: flex; gap: 12px; align-items: center; }
    .pause-banner button { padding: 3px 10px; font-size: 12px; border: 1px solid var(--banner-danger-border); border-radius: 5px;
                           background: transparent; color: var(--banner-danger-text); cursor: pointer; }
    .flush-btn { margin-left: 8px; padding: 2px 10px; font-size: 11px; border: 1px solid var(--button-danger-deep-bg); border-radius: 5px;
                 background: var(--button-muted-bg); color: var(--soft-danger-text); cursor: pointer; vertical-align: 1px; }
    .flush-btn:hover { background: var(--button-danger-deep-bg); color: var(--banner-danger-text); }

    .progress { margin-bottom: 18px; }
    .progress-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted-text); margin-bottom: 5px; }
    .progress-track { height: 8px; border-radius: 4px; background: var(--progress-track); overflow: hidden; }
    .progress-fill { height: 100%; width: 0; border-radius: 4px; background: var(--progress-fill); transition: width .3s ease; }

    @media (max-width: 720px) {
      body { padding: 14px; }
      h2 { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
      h2 .count-badge, .flush-btn { margin-left: 0; }
      .pacers { gap: 8px; }
      .pacer { width: 100%; flex-wrap: wrap; gap: 4px 14px; }
      .item { flex-wrap: wrap; }
      .item .label { flex: 1 1 100%; order: 1; }
      .item .age { margin-left: auto; }
      .pause-banner { flex-wrap: wrap; }
    }
  </style>
</head>
<body data-page="queue">
  __NAV__
  <h1>Scrape Queue</h1>
  <div class="sub">background searches and metadata updates deferred by pacing; unpaced sites share three scrape slots (overflow queues here), paced sites run one at a time, oldest first</div>
  <div class="progress" id="progress" style="display:none">
    <div class="progress-head"><span id="progress-label"></span><span id="progress-pct"></span></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </div>
  <div class="pacers" id="pacers"></div>
  <div class="pause-banner" id="pause-banner" style="display:none"></div>
  <h2>Searches <span class="count-badge" id="search-count"></span>
    <button type="button" class="flush-btn" onclick="flushKind('search')">Flush</button></h2>
  <div class="list" id="searches"></div>
  <h2>Updates <span class="count-badge" id="update-count"></span>
    <button type="button" class="flush-btn" onclick="flushKind('update')">Flush</button></h2>
  <div class="list" id="updates"></div>

  <script>
    let STATE = __STATE_JSON__;
    let fetchedAt = Date.now();

    function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

    function fmtSecs(s) {
      if (s == null || s < 0) s = 0;
      const m = Math.floor(s / 60);
      return m ? m + 'm ' + String(Math.floor(s % 60)).padStart(2, '0') + 's' : Math.floor(s) + 's';
    }

    function render() {
      const drift = (Date.now() - fetchedAt) / 1000;
      const fl = STATE.fastLane;
      const flTile = !fl ? '' : `<div class="pacer"><span class="tag">unpaced sites</span>` +
        `<span class="cd ${fl.busy < fl.slots ? 'ready' : ''}">${fl.busy}/${fl.slots} slots busy</span>` +
        (fl.waiting ? `<span class="win">${fl.waiting} waiting for a slot</span>` : '') + '</div>';
      document.getElementById('pacers').innerHTML = flTile + (STATE.pacers || []).map((p) => {
        const wait = Math.max(0, p.wait - drift);
        const ban = Math.max(0, (p.ban || 0) - drift);
        const ready = wait <= 0 && !p.busy;
        const status = ban > 0 ? `<span class="cd banned">BANNED — ${fmtSecs(ban)}</span>`
          : `<span class="cd ${ready ? 'ready' : ''}">${p.busy ? 'working…' : ready ? 'ready' : 'next turn in ' + fmtSecs(wait)}</span>`;
        return `<div class="pacer"><span class="tag">${esc(p.tag)}</span>` + status +
          `<span class="win">scenes ${p.window_used}/${p.window_max} per 10 min</span></div>`;
      }).join('') || '<div class="empty">no paced scrapers registered</div>';

      const total = STATE.total || 0;
      const done = Math.min(STATE.done || 0, total);
      const box = document.getElementById('progress');
      if (total > 0) {
        const pct = Math.round((done / total) * 100);
        document.getElementById('progress-label').textContent =
          `${done} of ${total} done · ${STATE.running || 0} running · ${STATE.pending || 0} left`;
        document.getElementById('progress-pct').textContent = pct + '%';
        document.getElementById('progress-fill').style.width = pct + '%';
        box.style.display = '';
      } else {
        box.style.display = 'none';
      }

      const banner = document.getElementById('pause-banner');
      if (STATE.paused) {
        const left = Math.max(0, (STATE.resumeIn || 0) - drift);
        banner.innerHTML = `Queue paused — ${esc(STATE.pauseReason || 'ban detected')} · auto-resumes in ${fmtSecs(left)} ` +
          '<button type="button" onclick="resumeQueue()">Resume Now</button>';
        banner.style.display = 'flex';
      } else {
        banner.style.display = 'none';
      }

      for (const [kind, listId, countId] of [['search', 'searches', 'search-count'], ['update', 'updates', 'update-count']]) {
        const rows = (STATE.entries || []).filter((e) => e.kind === kind);
        document.getElementById(countId).textContent = rows.length + ' queued';
        document.getElementById(listId).innerHTML = rows.map((e, i) => `
          <div class="item ${e.running ? 'running' : ''}">
            ${e.running ? '<div class="spinner"></div>' : `<span class="pos">#${i + 1}</span>`}
            <span class="label">${esc(e.label)}</span>
            <span class="age">${e.running ? 'running ' + fmtSecs(e.running_for + drift) : 'waiting ' + fmtSecs(e.waited + drift)}</span>
          </div>`).join('') || '<div class="empty">nothing queued</div>';
      }
    }

    const TOKEN = new URLSearchParams(location.search).get('token');

    const sleep = (ms) => new Promise((done) => setTimeout(done, ms));

    async function refresh(since) {
      let ok = false;
      try {
        const headers = { accept: 'application/json' };
        if (TOKEN) headers['x-admin-token'] = TOKEN;
        const url = since == null ? '/queue/api/state' : `/queue/api/state?wait=1&since=${since}`;
        const res = await fetch(url, { headers });
        if (res.ok) { STATE = await res.json(); fetchedAt = Date.now(); ok = true; }
      } catch {}
      render();
      return ok;
    }

    async function watch() {
      for (;;) {
        if (document.hidden) { await sleep(1000); continue; }
        const started = Date.now();
        const ok = await refresh(STATE.revision ?? 0);
        if (!ok && Date.now() - started < 1000) await sleep(1000);
      }
    }

    async function post(path, body) {
      const headers = { 'Content-Type': 'application/json' };
      if (TOKEN) headers['x-admin-token'] = TOKEN;
      const res = await fetch(path, { method: 'POST', headers, body: JSON.stringify(body || {}) });
      if (res.ok) { STATE = await res.json(); fetchedAt = Date.now(); render(); }
    }

    function flushKind(kind) {
      const n = (STATE.entries || []).filter((e) => e.kind === kind && !e.running).length;
      if (!n) return;
      if (!confirm('Drop ' + n + ' pending ' + kind + ' job(s)? Persisted descriptors are removed too.')) return;
      post('/queue/api/flush', { kind });
    }

    function resumeQueue() { post('/queue/api/resume'); }

    render();
    setInterval(render, 1000);
    watch();
  </script>
</body>
</html>
