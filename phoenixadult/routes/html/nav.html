{% include 'theme.html' %}
<style>
  :root { --app-nav-h: 46px; }
  html { scrollbar-gutter: stable; }
  .app-nav, .app-nav *, .app-nav-spacer { box-sizing: border-box; }
  .app-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 40; height: var(--app-nav-h); display: flex; align-items: stretch;
             background: var(--nav-bg); border-bottom: 1px solid var(--nav-border); padding: 0 14px; overflow-x: auto; scrollbar-width: none;
             view-transition-name: app-nav; }
  .app-nav::-webkit-scrollbar { display: none; }
  .app-nav a { display: flex; align-items: center; padding: 0 14px; border-bottom: 2px solid transparent; color: var(--nav-link-text); text-decoration: none;
               font: 500 14px/1 system-ui, sans-serif; white-space: nowrap; }
  .app-nav a:hover { background: var(--nav-link-hover-bg); color: var(--nav-link-hover-text); }
  .app-nav a.active { border-bottom-color: var(--nav-active-underline); color: var(--nav-active-text); }
  .app-nav-spacer { height: var(--app-nav-h); }
  .theme-ctl { margin-left: auto; display: flex; align-items: center; gap: 4px; padding-left: 14px; flex: none; }
  .theme-ctl button { display: flex; align-items: center; justify-content: center; height: 28px; min-width: 30px; width: auto;
                      margin: 0; padding: 0 7px; flex: none; background: none; border: 1px solid transparent; border-radius: 6px;
                      color: var(--nav-link-text); cursor: pointer; font: 500 12px/1 system-ui, sans-serif; }
  .theme-ctl button:hover { background: var(--nav-link-hover-bg); color: var(--nav-link-hover-text); }
  .theme-ctl button.active { background: var(--nav-toggle-active-bg); border-color: var(--nav-toggle-active-border); color: var(--nav-active-text); }
  .theme-ctl svg { display: block; }
  .nav-user { margin-left: auto; }
  .nav-user + .theme-ctl, .nav-logout + .theme-ctl { margin-left: 0; }
  .nav-logout { display: flex; align-items: center; height: 28px; align-self: center; margin: 0 0 0 4px; padding: 0 10px; flex: none; width: auto;
                background: none; min-width: 0; white-space: nowrap;
                border: 1px solid var(--nav-border); border-radius: 6px; color: var(--nav-link-text); cursor: pointer; font: 500 12px/1 system-ui, sans-serif; }
  .nav-logout:hover { background: var(--nav-link-hover-bg); color: var(--nav-link-hover-text); }
</style>
<nav class="app-nav">{% for key, label, href in nav_items() %}<a href="{{ href }}"{% if key == active %} class="active" aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}{% if username %}<a href="/account" class="nav-user" title="Account">{{ username }}</a><button type="button" class="nav-logout" title="Log out">Log Out</button>{% endif %}
  <div class="theme-ctl" role="group" aria-label="Theme">
    <button type="button" data-set="light" title="Light theme" aria-label="Light theme">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" data-set="auto" title="Follow system theme" aria-label="Follow system theme">Auto</button>
    <button type="button" data-set="dark" title="Dark theme" aria-label="Dark theme">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</nav>
<div class="app-nav-spacer" aria-hidden="true"></div>
<script type="speculationrules">
{ "prerender": [{ "where": { "selector_matches": ".app-nav a" }, "eagerness": "moderate" }] }
</script>
<script>
  (function () {
    const logout = document.querySelector('.nav-logout');
    if (logout) logout.addEventListener('click', async () => {
      try { await fetch('/logout', { method: 'POST' }); } catch (e) {}
      location.href = '/login';
    });
    const buttons = document.querySelectorAll('.theme-ctl button');
    function paint() {
      const mode = window.paTheme ? window.paTheme.mode() : 'auto';
      for (const b of buttons) b.classList.toggle('active', b.dataset.set === mode);
    }
    for (const b of buttons) b.addEventListener('click', () => window.paTheme.set(b.dataset.set));
    document.addEventListener('pa-theme-change', paint);
    paint();
  })();
</script>
