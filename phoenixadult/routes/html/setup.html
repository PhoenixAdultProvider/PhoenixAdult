<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create Admin Account — PhoenixAdult</title>
{% include 'theme.html' %}
<style>
  body { font-family: system-ui, sans-serif; background: var(--page-bg); color: var(--page-text); margin: 0;
         min-height: 100svh; display: flex; align-items: center; justify-content: center;
         padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 28px 26px;
          width: 100%; max-width: 380px; }
  h1 { font-size: 20px; margin: 0 0 4px; color: var(--heading-text); }
  .sub { color: var(--muted-text); font-size: 13px; margin: 0 0 20px; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--label-text); margin: 12px 0 4px; }
  .field-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .field-head label { margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--page-text);
          padding: 11px 12px; border-radius: 7px; font-size: 16px; }
  /* Room at the right edge for password-manager icons, which overlay the field itself. */
  input[type=password], input.revealed { padding-right: 44px; }
  input:focus { outline: 0; border-color: var(--input-focus-border); }
  input::-ms-reveal, input::-webkit-credentials-auto-fill-button { display: none; }
  .reveal { width: auto; min-height: 32px; margin: 0; padding: 0 4px; background: none; border: 0; color: var(--link-text); font-size: 12px;
            text-transform: uppercase; letter-spacing: .04em; cursor: pointer; }
  .reveal:hover { background: none; text-decoration: underline; }
  .hint { font-size: 11px; color: var(--hint-text); margin-top: 4px; }
  .meter { height: 5px; margin-top: 6px; background: var(--progress-track); border-radius: 3px; overflow: hidden; }
  .meter-fill { height: 100%; width: 0; border-radius: 3px; transition: width .2s ease, background .2s ease; }
  .meter-fill[data-score='0'], .meter-fill[data-score='1'] { background: var(--button-danger-bg); }
  .meter-fill[data-score='2'] { background: var(--badge-warning-text); }
  .meter-fill[data-score='3'] { background: var(--progress-fill); }
  .meter-fill[data-score='4'] { background: var(--button-success-bg); }
  button { width: 100%; margin-top: 20px; padding: 13px; border: 0; border-radius: 7px; background: var(--button-primary-bg); color: var(--button-text);
           font-size: 16px; font-weight: 500; cursor: pointer; }
  button:hover { background: var(--button-primary-hover-bg); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .err { margin-top: 14px; font-size: 13px; color: var(--status-danger-text); min-height: 1em; }
  @media (max-width: 420px) {
    .card { border: 0; border-radius: 0; padding: 24px 18px; background: none; }
    body { align-items: flex-start; padding-top: max(32px, env(safe-area-inset-top)); }
  }
</style>
</head>
<body data-page="config">
  <form class="card" id="setupForm" method="post" action="/setup" autocomplete="on">
    <h1>Create Admin Account</h1>
    <div class="sub">First run — this account manages users and Plex connections.</div>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" required autofocus>
    <div class="field-head">
      <label for="password">Password</label>
      <button type="button" class="reveal" data-for="password">Show</button>
    </div>
    <input id="password" name="password" type="password" autocomplete="new-password" enterkeyhint="next" required>
    <div class="hint">8+ characters with an uppercase letter, a number, and a special character.</div>
    <div class="meter" id="pwMeter" hidden><div class="meter-fill" id="pwMeterFill"></div></div>
    <div class="hint" id="pwMeterText"></div>
    <div class="field-head">
      <label for="confirm">Confirm Password</label>
      <button type="button" class="reveal" data-for="confirm">Show</button>
    </div>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" enterkeyhint="go" required>
    <div class="hint">Store this somewhere safe — recovery requires shell access to the server.</div>
    <button type="submit" id="submitBtn">Create Account</button>
    <div class="err" id="err">{{ error }}</div>
  </form>
  <script>
    const form = document.getElementById('setupForm');
    const err = document.getElementById('err');
    const btn = document.getElementById('submitBtn');
    const pwField = document.getElementById('password');
    const confirmField = document.getElementById('confirm');
    const RULE = 'Password needs 8+ characters with an uppercase letter, a number, and a special character.';

    document.querySelectorAll('.reveal').forEach((toggle) => {
      toggle.addEventListener('click', () => {
        const field = document.getElementById(toggle.dataset.for);
        const show = field.type === 'password';
        field.type = show ? 'text' : 'password';
        field.classList.toggle('revealed', show);
        toggle.textContent = show ? 'Hide' : 'Show';
      });
    });

    function policyError(pw) {
      const ok = pw.length >= 8 && /[A-Z]/.test(pw) && /[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw);
      return ok ? '' : RULE;
    }

    const METER_LABELS = ['Very Weak', 'Weak', 'Fair', 'Strong', 'Very Strong'];
    let meterTimer = 0;
    pwField.addEventListener('input', () => {
      clearTimeout(meterTimer);
      const value = pwField.value;
      const meter = document.getElementById('pwMeter');
      if (!value) { meter.hidden = true; document.getElementById('pwMeterText').textContent = ''; return; }
      meterTimer = setTimeout(async () => {
        try {
          const res = await fetch('/api/password-strength', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: value }),
          });
          const data = await res.json();
          meter.hidden = false;
          const fill = document.getElementById('pwMeterFill');
          fill.dataset.score = data.score;
          fill.style.width = (data.score + 1) * 20 + '%';
          document.getElementById('pwMeterText').textContent = 'Strength: ' + METER_LABELS[data.score] + (data.feedback ? ' — ' + data.feedback : '');
        } catch (e) {}
      }, 250);
    });

    form.addEventListener('submit', (e) => {
      err.textContent = '';
      const problem = policyError(pwField.value) || (pwField.value === confirmField.value ? '' : 'Passwords do not match.');
      if (problem) { e.preventDefault(); err.textContent = problem; return; }
      btn.disabled = true;
      setTimeout(() => { btn.disabled = false; }, 5000);
    });
  </script>
</body>
</html>
