<script>
  const PASSWORD_RULE = {{ password_rule | tojson }};

  function policyError(pw) {
    const ok = pw.length >= 8 && /[A-Z]/.test(pw) && /[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw);
    return ok ? '' : PASSWORD_RULE;
  }

  document.querySelectorAll('.reveal').forEach((toggle) => {
    toggle.addEventListener('click', () => {
      const field = document.getElementById(toggle.dataset.for);
      const show = field.type === 'password';
      field.type = show ? 'text' : 'password';
      field.classList.toggle('revealed', show);
      toggle.textContent = show ? 'Hide' : 'Show';
    });
  });

  const METER_LABELS = ['Very Weak', 'Weak', 'Fair', 'Strong', 'Very Strong'];

  function wirePasswordMeter(field) {
    let meterTimer = 0;
    field.addEventListener('input', () => {
      clearTimeout(meterTimer);
      const value = field.value;
      const meter = document.getElementById('pwMeter');
      if (!value) { meter.hidden = true; document.getElementById('pwMeterText').textContent = ''; return; }
      meterTimer = setTimeout(async () => {
        try {
          const res = await fetch('/api/password-strength', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: value }),
          });
          const data = await res.json();
          meter.hidden = false;
          const fill = document.getElementById('pwMeterFill');
          fill.dataset.score = data.score;
          fill.style.width = (data.score + 1) * 20 + '%';
          document.getElementById('pwMeterText').textContent = 'Strength: ' + METER_LABELS[data.score] + (data.feedback ? ' — ' + data.feedback : '');
        } catch (e) {}
      }, 250);
    });
  }
</script>
