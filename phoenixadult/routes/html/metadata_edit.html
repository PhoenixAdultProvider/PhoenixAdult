<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <title>Edit Snapshot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; margin: 0; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
    .sub code { color: #cbd5e1; }
    .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; align-items: start; }
    fieldset { border: 1px solid #334155; border-radius: 8px; padding: 14px 16px 18px; margin: 0 0 20px; background: #151b29; }
    legend { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: .04em; padding: 0 6px; }
    label { display: block; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 3px; }
    input[type=text], input[type=date], textarea {
      width: 100%; max-width: 100%; min-width: 0; background: #1e2433; border: 1px solid #334155; color: #e2e8f0;
      padding: 7px 10px; border-radius: 6px; font-size: 13px; font-family: inherit;
    }
    input[type=date] { -webkit-appearance: none; appearance: none; }
    input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }
    textarea { min-height: 110px; resize: vertical; }
    input:focus, textarea:focus { outline: 0; border-color: #2563eb; }
    .hint { font-size: 11px; color: #475569; margin-top: 3px; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; background: #1e2433; border: 1px solid #334155; border-radius: 20px; padding: 3px 6px 3px 11px; font-size: 12px; }
    .chip button { background: none; border: 0; color: #64748b; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 3px; }
    .chip button:hover { color: #f87171; }
    .addrow { display: flex; gap: 6px; margin-top: 8px; }
    .addrow input { flex: 1; }
    .addrow button { flex: 0 0 auto; padding: 0 14px; border: 1px solid #334155; border-radius: 6px; background: #1e2433; color: #94a3b8; cursor: pointer; font-size: 12px; }
    .addrow button:hover { color: #e2e8f0; border-color: #475569; }

    .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 6px; }
    .img { background: #1e2433; border: 1px solid #334155; border-radius: 8px; padding: 8px; }
    .img img { width: 100%; height: 150px; object-fit: contain; background: #0b0d12; border-radius: 4px; display: block; }
    .img select { width: 100%; margin-top: 6px; background: #0f1117; border: 1px solid #334155; color: #e2e8f0; border-radius: 5px; padding: 4px; font-size: 11px; }
    .img .drop { width: 100%; margin-top: 6px; padding: 4px; border: 1px solid #7f1d1d; border-radius: 5px; background: #1e293b; color: #f87171; cursor: pointer; font-size: 11px; }
    .img .drop:hover { background: #7f1d1d; color: #fff; }

    .bar { display: flex; gap: 10px; align-items: center; margin-top: 8px; position: sticky; bottom: 0; background: #0f1117; padding: 14px 0; border-top: 1px solid #1a2035; }
    .save { padding: 9px 22px; border: 0; border-radius: 6px; background: #15803d; color: #fff; cursor: pointer; font-size: 14px; font-weight: 500; }
    .save:hover { background: #16a34a; }
    .save:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .cancel { padding: 9px 18px; border: 1px solid #334155; border-radius: 6px; background: #1e2433; color: #94a3b8; cursor: pointer; font-size: 14px; }
    .cancel:hover { color: #e2e8f0; }
    .status { font-size: 12px; color: #64748b; }

    @media (max-width: 720px) {
      body { padding: 14px; }
      .cols { grid-template-columns: 1fr; gap: 0; }
      .imgs { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
      .addrow { flex-wrap: wrap; }
      .addrow button { width: 100%; padding: 8px 14px; }
      .bar { flex-wrap: wrap; }
      .save, .cancel { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <h1>Edit Snapshot</h1>
  <div class="sub">__SUBTITLE__</div>

  <div class="cols">
    <div>
      <fieldset>
        <legend>Scene</legend>
        <label for="f-title">Title</label>
        <input type="text" id="f-title">
        <label for="f-titleSort">Sort Title</label>
        <input type="text" id="f-titleSort">
        <label for="f-date">Date</label>
        <input type="date" id="f-date">
        <label for="f-studio">Studio</label>
        <input type="text" id="f-studio">
        <div class="hint">Changing Studio or Tagline moves the snapshot folder.</div>
        <label for="f-tagline">Tagline</label>
        <input type="text" id="f-tagline">
        <label for="f-summary">Summary</label>
        <textarea id="f-summary"></textarea>
      </fieldset>

      <fieldset>
        <legend>Genres</legend>
        <div class="chips" id="c-Genre"></div>
        <div class="addrow"><input type="text" id="a-Genre" placeholder="Add a genre…"><button data-add="Genre">Add</button></div>
      </fieldset>

      <fieldset>
        <legend>Collections</legend>
        <div class="chips" id="c-Collection"></div>
        <div class="addrow"><input type="text" id="a-Collection" placeholder="Add a collection…"><button data-add="Collection">Add</button></div>
      </fieldset>
    </div>

    <div>
      <fieldset>
        <legend>Actors</legend>
        <div class="chips" id="c-Role"></div>
        <div class="addrow"><input type="text" id="a-Role" placeholder="Add an actor…"><button data-add="Role">Add</button></div>
        <div class="hint">A removed name loses its cached headshot link; a new one resolves on the next serve.</div>
      </fieldset>

      <fieldset>
        <legend>Directors</legend>
        <div class="chips" id="c-Director"></div>
        <div class="addrow"><input type="text" id="a-Director" placeholder="Add a director…"><button data-add="Director">Add</button></div>
      </fieldset>

      <fieldset>
        <legend>Producers</legend>
        <div class="chips" id="c-Producer"></div>
        <div class="addrow"><input type="text" id="a-Producer" placeholder="Add a producer…"><button data-add="Producer">Add</button></div>
      </fieldset>

      <fieldset>
        <legend>Images</legend>
        <div class="imgs" id="imgs"></div>
        <div class="addrow"><input type="text" id="a-img" placeholder="https://… (downloaded on save)"><button id="addImg">Add</button></div>
        <div class="hint">Removed images are deleted from disk when the snapshot is rewritten.</div>
      </fieldset>
    </div>
  </div>

  <div class="bar">
    <button class="save" id="saveBtn" onclick="save()">Save</button>
    <button class="cancel" onclick="leave()">Cancel</button>
    <span class="status" id="status"></span>
  </div>

  <script>
    const TOKEN = __TOKEN__;
    const KEY = __KEY__;
    const MD = __METADATA__;
    const KINDS = ['coverPoster', 'background', 'backgroundSquare'];
    const LISTS = {Genre: [], Collection: [], Role: [], Director: [], Producer: []};
    let images = [];

    function hdrs() { return {'Content-Type': 'application/json', ...(TOKEN ? {'x-admin-token': TOKEN} : {})}; }
    function qs(id) { return document.getElementById(id); }

    function leave() { location.href = '/metadata' + (TOKEN ? '?token=' + encodeURIComponent(TOKEN) : ''); }

    function renderChips(field) {
      const box = qs('c-' + field);
      box.textContent = '';
      LISTS[field].forEach((value, idx) => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.appendChild(document.createTextNode(value));
        const drop = document.createElement('button');
        drop.textContent = '×';
        drop.title = 'Remove';
        drop.onclick = () => { LISTS[field].splice(idx, 1); renderChips(field); };
        chip.appendChild(drop);
        box.appendChild(chip);
      });
    }

    function addTo(field, input) {
      const value = input.value.trim();
      if (!value || LISTS[field].includes(value)) { input.value = ''; return; }
      LISTS[field].push(value);
      input.value = '';
      renderChips(field);
    }

    function renderImages() {
      const box = qs('imgs');
      box.textContent = '';
      images.forEach((img, idx) => {
        const card = document.createElement('div');
        card.className = 'img';
        const preview = document.createElement('img');
        preview.src = img.url;
        preview.loading = 'lazy';
        card.appendChild(preview);
        const kind = document.createElement('select');
        KINDS.forEach(k => {
          const opt = document.createElement('option');
          opt.value = k;
          opt.textContent = k;
          if (k === img.type) opt.selected = true;
          kind.appendChild(opt);
        });
        kind.onchange = () => { images[idx].type = kind.value; };
        card.appendChild(kind);
        const drop = document.createElement('button');
        drop.className = 'drop';
        drop.textContent = 'Remove';
        drop.onclick = () => { images.splice(idx, 1); renderImages(); };
        card.appendChild(drop);
        box.appendChild(card);
      });
    }

    function load() {
      qs('f-title').value = MD.title || '';
      qs('f-titleSort').value = MD.titleSort || '';
      qs('f-date').value = MD.originallyAvailableAt || '';
      qs('f-studio').value = MD.studio || '';
      qs('f-tagline').value = MD.tagline || '';
      qs('f-summary').value = MD.summary || '';
      LISTS.Genre = (MD.Genre || []).map(g => g.tag);
      LISTS.Collection = (MD.Collection || []).map(c => c.tag);
      LISTS.Role = (MD.Role || []).map(r => r.tag);
      LISTS.Director = (MD.Director || []).map(r => r.tag);
      LISTS.Producer = (MD.Producer || []).map(r => r.tag);
      Object.keys(LISTS).forEach(renderChips);
      images = (MD.Image || []).map(i => ({url: i.url, type: i.type}));
      renderImages();
    }

    async function save() {
      const btn = qs('saveBtn');
      btn.disabled = true;
      qs('status').textContent = 'Saving…';
      const body = {
        key: KEY,
        title: qs('f-title').value.trim(),
        titleSort: qs('f-titleSort').value.trim(),
        originallyAvailableAt: qs('f-date').value.trim(),
        studio: qs('f-studio').value.trim(),
        tagline: qs('f-tagline').value.trim(),
        summary: qs('f-summary').value.trim(),
        Genre: LISTS.Genre,
        Collection: LISTS.Collection,
        Role: LISTS.Role,
        Director: LISTS.Director,
        Producer: LISTS.Producer,
        Image: images,
      };
      let payload = {};
      try {
        const r = await fetch('/metadata/save', {method: 'POST', headers: hdrs(), body: JSON.stringify(body)});
        payload = await r.json();
      } catch (err) {
        payload = {ok: false, error: String(err)};
      }
      if (payload.ok) { leave(); return; }
      btn.disabled = false;
      qs('status').textContent = 'Save failed: ' + (payload.error || 'unknown error');
    }

    document.querySelectorAll('[data-add]').forEach(btn => {
      const field = btn.dataset.add;
      btn.onclick = () => addTo(field, qs('a-' + field));
      qs('a-' + field).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTo(field, qs('a-' + field)); } });
    });
    qs('addImg').onclick = () => {
      const input = qs('a-img');
      const url = input.value.trim();
      if (!url) return;
      images.push({url, type: 'coverPoster'});
      input.value = '';
      renderImages();
    };
    qs('a-img').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); qs('addImg').click(); } });

    load();
  </script>
</body>
</html>
