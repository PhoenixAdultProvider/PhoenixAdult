<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <title>Edit Headshot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; }
    h1 { font-size: 30px; margin: 0 0 6px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .copy { padding: 5px 14px; border: 1px solid var(--border-3); border-radius: 6px; background: var(--surface-2); color: var(--text-muted); cursor: pointer; font-size: 12px; font-family: inherit; }
    .copy:hover { color: var(--text); border-color: var(--text-faint); }
    .copy.done { background: var(--ok-solid); border-color: var(--ok-solid); color: var(--on-solid); }
    a.iafd { text-decoration: none; line-height: normal; }
    .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
    .sub code { color: var(--text-2); }
    h1, .sub, .wrap { max-width: 900px; margin-inline: auto; }
    fieldset { border: 1px solid var(--border-3); border-radius: 8px; padding: 14px 16px 18px; margin: 0 0 20px; background: var(--surface); }
    legend { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; padding: 0 6px; }
    label { display: block; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 3px; }
    input[type=text] { width: 100%; max-width: 100%; min-width: 0; background: var(--surface-2); border: 1px solid var(--border-3); color: var(--text); padding: 7px 10px; border-radius: 6px; font-size: 13px; }
    input[type=text]:focus { outline: 0; border-color: var(--accent); }
    .hint { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
    .fetchrow { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    .fetchrow select { flex: 1 1 180px; min-width: 0; background: var(--surface-2); border: 1px solid var(--border-3); color: var(--text); padding: 7px 10px; border-radius: 6px; font-size: 13px; }
    .fetch { flex: 0 0 auto; padding: 7px 16px; border: 1px solid var(--border-3); border-radius: 6px; background: var(--surface-2); color: var(--text-2); cursor: pointer; font-size: 13px; font-family: inherit; }
    .fetch:hover { background: var(--accent); border-color: var(--accent); color: var(--on-solid); }
    .fetch:disabled { color: var(--text-dim); cursor: not-allowed; background: var(--surface-2); }
    .toggle { display: flex; align-items: center; gap: 9px; margin-top: 14px; font-size: 13px; color: var(--text-2); }
    .toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
    .imgs { display: flex; gap: 12px; }
    figure { margin: 0; flex: 1; text-align: center; }
    figcaption { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    figure img { width: 100%; height: 240px; object-fit: contain; background: var(--well); border-radius: 6px; }
    .bar { display: flex; gap: 10px; align-items: center; margin-top: 18px; }
    .save { padding: 9px 22px; border: 0; border-radius: 6px; background: var(--ok-solid); color: var(--on-solid); cursor: pointer; font-size: 14px; font-weight: 500; }
    .save:hover { background: var(--ok-solid-2); }
    .save:disabled { background: var(--border-3); color: var(--text-dim); cursor: not-allowed; }
    .cancel { padding: 9px 18px; border: 1px solid var(--border-3); border-radius: 6px; background: var(--surface-2); color: var(--text-muted); cursor: pointer; font-size: 14px; }
    .cancel:hover { color: var(--text); }
    .status { font-size: 12px; color: var(--text-dim); }
    .recorded { width: 100%; background: var(--surface-2); border: 1px solid var(--border-3); color: var(--text); padding: 7px 10px; border-radius: 6px; font-size: 13px; }
    .recorded:focus { outline: 0; border-color: var(--accent); }
    #sfwToggle.on { background: var(--ok-solid); border-color: var(--ok-solid); color: var(--on-solid); }
    body.sfw #previewCard { display: none; }
    .scenewrap { max-height: 340px; overflow: auto; border-radius: 6px; }
    .scenes { width: 100%; border-collapse: collapse; font-size: 13px; }
    .scenes th {
      position: sticky; top: 0; background: var(--surface); text-align: left; font-weight: 500; color: var(--text-dim);
      font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 4px 10px 6px; border-bottom: 1px solid var(--border-3);
    }
    .scenes td { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text-2); vertical-align: top; }
    .scenes tr:last-child td { border-bottom: 0; }
    .scenes td.nowrap { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .scenes a { color: var(--accent-text-2); text-decoration: none; }
    .scenes a:hover { text-decoration: underline; }

    @media (max-width: 720px) {
      body { padding: 14px; }
      .imgs { flex-wrap: wrap; }
      figure { flex: 1 1 140px; }
      figure img { height: 200px; }
      .bar { flex-wrap: wrap; }
      .save, .cancel { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  __NAV__
  <h1><span id="actorName">__ACTOR_NAME__</span><button class="copy" id="copyName" title="Copy Name">Copy</button><a class="copy iafd" id="iafdLink" target="_blank" rel="noopener noreferrer">Search IAFD</a><button class="copy" id="sfwToggle" onclick="toggleSfw()"></button></h1>
  <div class="sub">__SUBTITLE__</div>

  <div class="wrap">
    <fieldset>
      <legend>Source</legend>
      <label for="f-upstream">Upstream Original URL</label>
      <input type="text" id="f-upstream" placeholder="https://…">
      <div class="fetchrow">
        <select id="f-source"></select>
        <button class="fetch" id="fetchBtn">Fetch From</button>
        <span class="status" id="fetchStatus"></span>
      </div>
      <div class="hint">Fetch From looks the performer up at that source and fills the URL above; nothing is downloaded until you save.</div>
      <div class="toggle"><input type="checkbox" id="f-cropped"><label for="f-cropped" style="margin:0;text-transform:none;letter-spacing:0;font-size:13px;color:var(--text-2)">Cropped Status — face-crop the image</label></div>
      <div class="hint" id="cropHint"></div>
      <label for="f-recorded">Recorded Source</label>
      <select id="f-recorded" class="recorded"></select>
      <div class="hint">Where this headshot came from. Correcting it only relabels the entry — the image is left alone.</div>
    </fieldset>

    <fieldset id="previewCard">
      <legend>Preview</legend>
      <div class="imgs">
        <figure><figcaption>Cached (Shown in Plex)</figcaption><img id="cachedImg" data-src="__CACHED_SRC__" alt=""></figure>
        <figure><figcaption>Upstream Original</figcaption><img id="upstreamImg" alt=""></figure>
      </div>
    </fieldset>

    <fieldset>
      <legend>Scenes</legend>
      __SCENES__
    </fieldset>

    <div class="bar">
      <button class="save" id="saveBtn" onclick="save()">Save</button>
      <button class="cancel" onclick="leave()">Cancel</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <script>
    const TOKEN = __TOKEN__;
    const FILENAME = __FILENAME__;
    const ENTRY = __ENTRY__;
    const SOURCES = __SOURCES__;
    const CROP_AVAILABLE = __CROP_AVAILABLE__;
    const RECORDED_SOURCES = __RECORDED_SOURCES__;
    const UNCROPPED_SOURCES = ['IAFD'];
    const SFW_KEY = 'metadata-sfw';
    let SFW = false;
    try { SFW = localStorage.getItem(SFW_KEY) === '1'; } catch {}

    function hdrs() { return {'Content-Type': 'application/json', ...(TOKEN ? {'x-admin-token': TOKEN} : {})}; }
    function qs(id) { return document.getElementById(id); }
    function leave() { location.href = '/people' + (TOKEN ? '?token=' + encodeURIComponent(TOKEN) : '') + '#' + ENTRY.type; }

    const fetched = {url: '', source: ''};

    function proxied(url) { return url ? '/images/proxy?url=' + encodeURIComponent(url) : ''; }

    function refreshUpstream() {
      const url = qs('f-upstream').value.trim();
      const img = qs('upstreamImg');
      if (SFW) { img.removeAttribute('src'); return; }
      img.src = proxied(url);
      img.style.visibility = url ? 'visible' : 'hidden';
    }

    async function save() {
      const btn = qs('saveBtn');
      btn.disabled = true;
      qs('status').textContent = 'Saving…';
      const upstream = qs('f-upstream').value.trim();
      const body = {
        filename: FILENAME,
        upstream_url: upstream,
        cropped: qs('f-cropped').checked,
        source: upstream === fetched.url ? fetched.source : '',
        recorded_source: qs('f-recorded').value,
      };
      let payload = {};
      try {
        const r = await fetch('/people/save', {method: 'POST', headers: hdrs(), body: JSON.stringify(body)});
        payload = await r.json();
      } catch (err) {
        payload = {ok: false, error: String(err)};
      }
      if (payload.ok) { leave(); return; }
      btn.disabled = false;
      qs('status').textContent = 'Save failed: ' + (payload.error || 'unknown error');
    }

    qs('f-upstream').value = ENTRY.upstream_url || '';
    qs('f-cropped').checked = !!ENTRY.cropped;
    if (!CROP_AVAILABLE) {
      qs('f-cropped').disabled = true;
      qs('cropHint').textContent = 'opencv-python-headless is not installed — cropping is unavailable.';
    }
    qs('f-upstream').addEventListener('change', refreshUpstream);
    refreshUpstream();

    SOURCES.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      qs('f-source').appendChild(opt);
    });

    for (const [value, label] of [['', 'Unrecorded'], ...RECORDED_SOURCES.map(n => [n, n])]) {
      const opt = document.createElement('option');
      opt.value = value;
      opt.textContent = label;
      if (value === (ENTRY.source || '')) opt.selected = true;
      qs('f-recorded').appendChild(opt);
    }

    qs('fetchBtn').onclick = async () => {
      const button = qs('fetchBtn');
      const source = qs('f-source').value;
      button.disabled = true;
      qs('fetchStatus').textContent = 'Searching ' + source + '…';
      let payload = {};
      try {
        const r = await fetch('/people/lookup', {method: 'POST', headers: hdrs(), body: JSON.stringify({filename: FILENAME, source})});
        payload = await r.json();
      } catch (err) {
        payload = {ok: false, error: String(err)};
      }
      button.disabled = false;
      if (!payload.ok) { qs('fetchStatus').textContent = payload.error || 'Lookup failed'; return; }
      qs('f-upstream').value = payload.url;
      fetched.url = payload.url;
      fetched.source = payload.source;
      qs('f-recorded').value = [...qs('f-recorded').options].some(o => o.value === payload.source) ? payload.source : '';
      let note = '';
      if (UNCROPPED_SOURCES.includes(payload.source) && qs('f-cropped').checked) {
        qs('f-cropped').checked = false;
        note = ' — cropping turned off';
      }
      refreshUpstream();
      qs('fetchStatus').textContent = 'Found at ' + payload.source + ' — save to apply' + note;
    };

    function paintSfw() {
      document.body.classList.toggle('sfw', SFW);
      const btn = qs('sfwToggle');
      btn.textContent = SFW ? 'SFW Mode: On' : 'SFW Mode: Off';
      btn.classList.toggle('on', SFW);
      btn.title = SFW ? 'Previews are hidden and never downloaded' : 'Hide the preview images';
      const cached = qs('cachedImg');
      if (SFW) {
        cached.removeAttribute('src');
        qs('upstreamImg').removeAttribute('src');
      } else {
        if (cached.dataset.src) cached.src = cached.dataset.src;
        refreshUpstream();
      }
    }

    function toggleSfw() {
      SFW = !SFW;
      try { localStorage.setItem(SFW_KEY, SFW ? '1' : '0'); } catch {}
      paintSfw();
    }

    paintSfw();

    qs('iafdLink').href = 'https://www.iafd.com/results.asp?searchtype=comprehensive&searchstring=' + encodeURIComponent(ENTRY.name || '').replace(/%20/g, '+');

    qs('copyName').onclick = async () => {
      const button = qs('copyName');
      const name = ENTRY.name || '';
      try {
        await navigator.clipboard.writeText(name);
      } catch {
        const field = document.createElement('textarea');
        field.value = name;
        document.body.appendChild(field);
        field.select();
        document.execCommand('copy');
        field.remove();
      }
      button.textContent = 'Copied';
      button.classList.add('done');
      setTimeout(() => { button.textContent = 'Copy'; button.classList.remove('done'); }, 1200);
    };
  </script>
</body>
</html>
