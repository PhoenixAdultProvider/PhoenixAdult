[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenixadult"
version = "1.0.0a344"
description = "Plex Metadata Provider for scene videos from multiple adult sites (FastAPI port)"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.40",
    "pydantic>=2.9",
    "Jinja2>=3.1",
    "uvicorn[standard]>=0.34",
    "httpx2>=2.0",
    "lxml>=5.0",
    "parsel>=1.9",
    "Pillow>=11.0",
    "python-dotenv>=1.0",
    "python-slugify>=8.0",
    "rapidfuzz>=3.10",
    "text-unidecode>=1.3",
    "w3lib>=1.21",
    "python-dateutil>=2.9",
    "text2digits>=0.1",
    "ddgs>=9.0",
    "cryptography>=43.0",
    "argon2-cffi>=23.1",
    "cachetools>=5.3",
    "filelock>=3.12",
    "ftfy>=6.1",
    "zxcvbn>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",  # the suite builds httpx.Response objects for respx mocks; the app itself uses httpx2
    "respx>=0.21",
    "pytest-httpx2>=1.0",  # respx-based mocking for httpx2 (Starlette TestClient + app clients)
    "ruff>=0.8",
    "mypy>=1.13",
]
# Optional: enables ACTOR_CACHE_FACE_ENABLE (face-detection headshot cropping).
# `pip install -e ".[face]"`. Absent -> the feature no-ops gracefully.
face = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
]
# Optional: enables the Playwright bypass backend (for sites behind JS / AWS-WAF
# challenges FlareSolverr can't solve). `pip install -e ".[playwright]"` then
# `playwright install chromium`. Absent -> the backend reports unavailable and is skipped.
playwright = [
    "playwright>=1.40",
]
# Optional: enables the Impersonate bypass backend (curl_cffi TLS-fingerprint
# impersonation) for Cloudflare-fingerprint-blocked sites. `pip install -e ".[impersonate]"`.
impersonate = [
    "curl_cffi>=0.7",
]

[tool.setuptools.packages.find]
include = ["phoenixadult*"]

[tool.setuptools.package-data]
phoenixadult = ["**/*.html", "**/*.css", "**/*.json", "**/*.svg", "**/*.ico", "**/*.onnx", "**/*.LICENSE"]

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["allow_network: permit real network access in this test"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Coverage is opt-in: `pytest --cov` costs ~45s on a full run. Settings live below.

[tool.coverage.run]
branch = true
source = ["phoenixadult"]
omit = ["phoenixadult/graveyard/*"]


[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
