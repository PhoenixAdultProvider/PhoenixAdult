# GitHub Pages twin of .forgejo/workflows/pages.yml; serves https://phoenixadultprovider.github.io/PhoenixAdult/
name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_REPO_URL: https://github.com/PhoenixAdultProvider/PhoenixAdult
      DOCS_REPO_LABEL: GitHub
      DOCS_SITE_URL: https://phoenixadultprovider.github.io
      DOCS_BASE_URL: /PhoenixAdult/
      DOCS_EDIT_URL: https://github.com/PhoenixAdultProvider/PhoenixAdult/edit/main/docs/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build site
        run: npm run build
        working-directory: website

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
