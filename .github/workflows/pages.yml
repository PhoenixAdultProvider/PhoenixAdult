# GitHub Pages twin of .forgejo/workflows/pages.yml; pull requests build and typecheck only, pushes to main also deploy.
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_REPO_URL: https://github.com/PhoenixAdultProvider/PhoenixAdult
      DOCS_REPO_LABEL: GitHub
      DOCS_SITE_URL: https://phoenixadultprovider.github.io
      DOCS_BASE_URL: /PhoenixAdult/
      DOCS_EDIT_URL: https://github.com/PhoenixAdultProvider/PhoenixAdult/edit/main/docs/
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Typecheck
        run: npm run typecheck
        working-directory: website

      - name: Build site
        run: npm run build
        working-directory: website

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
