# Mirrors .forgejo/workflows/ci.yml; change both when the gate changes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    container:
      image: python:3.13-bookworm
    env:
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Comments
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            python scripts/check_comments.py HEAD~1..HEAD
          else
            echo "no parent commit; skipping comment gate"
          fi

      - name: Install
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs
          pip install -q uv
          uv pip install --system -e '.[dev,face]'

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy phoenixadult

      - name: Tests
        run: pytest -q --no-cov
